<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
    <title>Space Invaders Overdrive</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #111;
            color: #fff;
            font-family: monospace;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            touch-action: none; /* Prevents pull-to-refresh and swiping on mobile */
        }
        #game-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }
        canvas {
            background-color: #000;
            border-bottom: 2px solid #333;
            max-width: 100%;
            max-height: 100%;
            image-rendering: pixelated;
        }
        #controls-container {
            width: 100%;
            /* This ensures a minimum of 60px padding, plus any extra safe area your Android nav bar needs */
            padding-bottom: max(60px, env(safe-area-inset-bottom));
            background-color: #222;
            display: flex;
            flex-direction: column;
        }
        .hud {
            display: flex;
            justify-content: space-between;
            padding: 10px 20px;
            font-size: 16px;
            color: #0f0;
            font-weight: bold;
        }
        .button-row {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            gap: 10px;
        }
        .btn {
            background-color: #333;
            color: white;
            border: 2px solid #555;
            border-radius: 8px;
            padding: 25px 0;
            font-size: 20px;
            font-weight: bold;
            flex: 1;
            text-align: center;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        .btn:active {
            background-color: #555;
        }
        #btn-special {
            background-color: #520;
            border-color: #f50;
            color: #fa0;
        }
        #btn-special:active {
            background-color: #830;
        }
    </style>
</head>
<body>

<div id="game-container">
    <!-- Square aspect ratio optimized for portrait mobile screens -->
    <canvas id="gameCanvas" width="400" height="400"></canvas>
</div>

<div id="controls-container">
    <div class="hud">
        <span id="scoreDisplay">SCORE: 0</span>
        <span id="specialCooldown">SPECIAL: READY</span>
    </div>
    <div class="button-row">
        <button class="btn" id="btn-left">◀</button>
        <button class="btn" id="btn-right">▶</button>
        <button class="btn" id="btn-fire">FIRE</button>
        <button class="btn" id="btn-special">MISSILE</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const specialCooldownDisplay = document.getElementById('specialCooldown');

    // === Audio System (Web Audio API) ===
    let audioCtx;
    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if(audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    function playSound(type) {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        const now = audioCtx.currentTime;
        
        if (type === 'shoot') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(400, now);
            osc.frequency.exponentialRampToValueAtTime(100, now + 0.1);
            gainNode.gain.setValueAtTime(0.05, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            osc.start(now);
            osc.stop(now + 0.1);
        } else if (type === 'special') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(100, now);
            osc.frequency.linearRampToValueAtTime(800, now + 0.3);
            gainNode.gain.setValueAtTime(0.1, now);
            gainNode.gain.linearRampToValueAtTime(0.01, now + 0.3);
            osc.start(now);
            osc.stop(now + 0.3);
        } else if (type === 'explosion') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(100, now);
            osc.frequency.exponentialRampToValueAtTime(10, now + 0.3);
            
            // Crunch/noise effect
            for (let i = 0; i < 8; i++) {
                setTimeout(() => {
                    if(!audioCtx) return;
                    const noise = audioCtx.createOscillator();
                    const nGain = audioCtx.createGain();
                    noise.type = 'square';
                    noise.frequency.value = Math.random() * 500 + 50;
                    noise.connect(nGain);
                    nGain.connect(audioCtx.destination);
                    nGain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                    nGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                    noise.start();
                    noise.stop(audioCtx.currentTime + 0.1);
                }, i * 25);
            }
            
            gainNode.gain.setValueAtTime(0.2, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
            osc.start(now);
            osc.stop(now + 0.3);
        }
    }

    // === Responsive Canvas Resize ===
    function resize() {
        const container = document.getElementById('game-container');
        const size = Math.min(container.clientWidth, container.clientHeight);
        canvas.style.width = size + 'px';
        canvas.style.height = size + 'px';
    }
    window.addEventListener('resize', resize);
    resize();

    // === Game State ===
    let score = 0;
    const player = { x: 185, y: 360, width: 30, height: 20, speed: 4 };
    let bullets = [];
    let aliens = [];
    let particles = [];
    
    // Weapon settings
    let specialReady = true;
    let specialCooldownTime = 3000; // 3 seconds
    let lastFireTime = 0;
    let fireRate = 120; // Rapid fire speed in milliseconds

    // Alien logic
    let alienDir = 1;
    let alienSpeed = 0.5;

    function initAliens() {
        aliens = [];
        for (let row = 0; row < 5; row++) {
            for (let col = 0; col < 8; col++) {
                aliens.push({
                    x: 40 + col * 40,
                    y: 40 + row * 30,
                    width: 20,
                    height: 20,
                    alive: true
                });
            }
        }
    }
    initAliens();

    // === Input Handling ===
    let leftPressed = false;
    let rightPressed = false;
    let firePressed = false;

    function bindControl(id, pressFn, releaseFn) {
        const el = document.getElementById(id);
        const handlePress = (e) => { e.preventDefault(); initAudio(); pressFn(); };
        const handleRelease = (e) => { e.preventDefault(); releaseFn(); };
        
        el.addEventListener('touchstart', handlePress);
        el.addEventListener('touchend', handleRelease);
        el.addEventListener('mousedown', handlePress);
        el.addEventListener('mouseup', handleRelease);
        el.addEventListener('mouseleave', handleRelease);
    }

    bindControl('btn-left', () => leftPressed = true, () => leftPressed = false);
    bindControl('btn-right', () => rightPressed = true, () => rightPressed = false);
    bindControl('btn-fire', () => firePressed = true, () => firePressed = false);
    
    bindControl('btn-special', () => {
        if (specialReady) {
            bullets.push({ 
                x: player.x + player.width/2 - 6, 
                y: player.y, 
                width: 12, height: 24, speed: 7, type: 'special' 
            });
            specialReady = false;
            specialCooldownDisplay.innerText = "SPECIAL: WAIT";
            specialCooldownDisplay.style.color = "#f00";
            playSound('special');
            
            setTimeout(() => {
                specialReady = true;
                specialCooldownDisplay.innerText = "SPECIAL: READY";
                specialCooldownDisplay.style.color = "#0f0";
            }, specialCooldownTime);
        }
    }, () => {});

    // === Particle Engine ===
    function createExplosion(x, y, color, count) {
        for (let i = 0; i < count; i++) {
            particles.push({
                x: x,
                y: y,
                vx: (Math.random() - 0.5) * 12,
                vy: (Math.random() - 0.5) * 12,
                life: 1.0,
                color: color,
                size: Math.random() * 4 + 2
            });
        }
    }

    // === Game Loop ===
    function update(time) {
        // Player movement
        if (leftPressed && player.x > 0) player.x -= player.speed;
        if (rightPressed && player.x < canvas.width - player.width) player.x += player.speed;

        // Rapid Fire Logic
        if (firePressed && time - lastFireTime > fireRate) {
            bullets.push({ 
                x: player.x + player.width/2 - 2, 
                y: player.y, 
                width: 4, height: 12, speed: 10, type: 'normal' 
            });
            lastFireTime = time;
            playSound('shoot');
        }

        // Bullet Logic & Collision
        for (let i = bullets.length - 1; i >= 0; i--) {
            bullets[i].y -= bullets[i].speed;
            
            if (bullets[i].y < -20) {
                bullets.splice(i, 1);
                continue;
            }
            
            let bulletDestroyed = false;
            for (let j = aliens.length - 1; j >= 0; j--) {
                let a = aliens[j];
                let b = bullets[i];
                
                // Collision Detection
                if (a.alive && b.x < a.x + a.width && b.x + b.width > a.x && b.y < a.y + a.height && b.y + b.height > a.y) {
                    a.alive = false;
                    bulletDestroyed = true;
                    score += 10;
                    
                    if (b.type === 'special') {
                        // Massive AoE explosion
                        createExplosion(a.x + a.width/2, a.y + a.height/2, '#fa0', 60);
                        playSound('explosion');
                        
                        // Destroy nearby aliens
                        for (let k = aliens.length - 1; k >= 0; k--) {
                            let a2 = aliens[k];
                            if (a2.alive) {
                                let dist = Math.hypot(a2.x - a.x, a2.y - a.y);
                                if (dist < 70) { // Splash radius
                                    a2.alive = false;
                                    score += 10;
                                    createExplosion(a2.x + a2.width/2, a2.y + a2.height/2, '#fa0', 15);
                                }
                            }
                        }
                    } else {
                        // Standard hit
                        createExplosion(a.x + a.width/2, a.y + a.height/2, '#0f0', 20);
                        playSound('explosion');
                    }
                    scoreDisplay.innerText = "SCORE: " + score;
                    break;
                }
            }
            if (bulletDestroyed) {
                bullets.splice(i, 1);
            }
        }

        // Alien Movement
        let edgeHit = false;
        let allDead = true;
        for (let a of aliens) {
            if (a.alive) {
                allDead = false;
                a.x += alienSpeed * alienDir;
                if (a.x <= 0 || a.x + a.width >= canvas.width) {
                    edgeHit = true;
                }
            }
        }
        
        if (edgeHit) {
            alienDir *= -1;
            for (let a of aliens) {
                a.y += 15; // Move down
            }
            alienSpeed += 0.2; // Speed up
        }
        
        if (allDead) {
            initAliens();
            alienSpeed += 0.5; // Next wave is faster
        }

        // Update Particles
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.life -= 0.03; // Fade out speed
            if (p.life <= 0) particles.splice(i, 1);
        }

        draw();
        requestAnimationFrame(update);
    }

    // === Rendering ===
    function draw() {
        // Clear screen
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Draw Player (Retro tank shape)
        ctx.fillStyle = '#0f0';
        ctx.fillRect(player.x, player.y, player.width, player.height);
        ctx.fillRect(player.x + 10, player.y - 8, 10, 8); // Turret
        ctx.fillRect(player.x + 13, player.y - 12, 4, 4); // Gun barrel

        // Draw Aliens
        ctx.fillStyle = '#f0f';
        for (let a of aliens) {
            if (a.alive) {
                ctx.fillRect(a.x, a.y, a.width, a.height);
                // Simple alien "eyes"
                ctx.fillStyle = '#000';
                ctx.fillRect(a.x + 4, a.y + 4, 4, 4);
                ctx.fillRect(a.x + 12, a.y + 4, 4, 4);
                ctx.fillStyle = '#f0f';
            }
        }

        // Draw Bullets
        for (let b of bullets) {
            if (b.type === 'special') {
                ctx.fillStyle = '#fff';
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#fa0';
                ctx.fillRect(b.x, b.y, b.width, b.height);
                ctx.fillStyle = '#fa0';
                ctx.fillRect(b.x + 2, b.y + 2, b.width - 4, b.height - 4);
            } else {
                ctx.fillStyle = '#fff';
                ctx.shadowBlur = 0;
                ctx.fillRect(b.x, b.y, b.width, b.height);
            }
            ctx.shadowBlur = 0; // Reset shadow
        }

        // Draw Particles
        for (let p of particles) {
            ctx.globalAlpha = Math.max(0, p.life);
            ctx.fillStyle = p.color;
            ctx.fillRect(p.x, p.y, p.size, p.size);
        }
        ctx.globalAlpha = 1.0;
    }

    // Start Game Loop
    requestAnimationFrame(update);
</script>
</body>
</html>
