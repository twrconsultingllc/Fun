# Tests: run the jsdom suites in tests/ on every push to main and every pull request.
#
# This repo is public, so Actions minutes cost nothing here. The run only reports:
# GitHub Pages publishes main on its own, whether this passes or not, so a red run
# means "look at the last push", not "the deploy was stopped".
#
# It runs `npm test` (every suite in tests/run.mjs, against the working copy).
# The Chromium checks (tests/*.chromium.mjs) aren't here: they need Playwright,
# a real browser and ffmpeg, and stay a by-hand check in a claude.ai/code session.

name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only token: this workflow never writes to the repo.
permissions:
  contents: read

# A newer push to the same branch or PR replaces a run still in progress.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install the test dependencies
        working-directory: tests
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run every suite
        working-directory: tests
        run: npm test
