# J.A.R.V.I.S. knowledge pack: build jarvis/knowledge/pack.json from its real sources.
#
# Run it by hand from the Actions tab ("J.A.R.V.I.S. knowledge pack" → Run workflow).
# It fetches NASA's planetary fact sheet, JPL's moon table, the Yale Bright Star
# Catalogue from CDS, NASA's master catalogue pages for the missions, PubChem's
# periodic table and the archived World Factbook profiles (see
# jarvis/knowledge/README.md), checks every record the way the page does, and
# commits pack.json only if the facts changed. If any source fails or any record
# is refused, the run fails and nothing is committed.
#
# There's no schedule: these are stable facts, so a rebuild is only needed when
# build.mjs or suits.json changes.

name: J.A.R.V.I.S. knowledge pack

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jarvis-knowledge
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # No token left in git config while the build runs; only the last step gets it, to push.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # The same build against the committed sample documents first, so a broken
      # parser fails here rather than halfway through the real sources.
      - name: Build from the sample documents
        working-directory: jarvis/knowledge
        run: node build.mjs --dry-run

      - name: Build from the real sources
        working-directory: jarvis/knowledge
        run: node build.mjs

      - name: Check the pack
        working-directory: jarvis/knowledge
        run: node build.mjs --check=pack.json

      - name: Commit if the facts changed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain -- jarvis/knowledge/pack.json)" ]; then
            echo "The facts haven't changed; nothing to commit."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jarvis/knowledge/pack.json
          git commit -m 'J.A.R.V.I.S.: build the knowledge pack'
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # Someone may have pushed while this ran; replay this one commit on top.
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
