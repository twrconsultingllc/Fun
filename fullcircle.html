<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Full Circle — The Mark</title>
<meta name="description" content="The Full Circle Triathlon logo rebuilt as a physically shaded 3D medallion — real metal, swept highlights and bloom, in a single Three.js page.">
<meta name="theme-color" content="#06070d">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%231976D2'/%3E%3Cpath d='M 50 2 A 48 48 0 0 1 50 98 A 24 24 0 0 1 50 50 A 24 24 0 0 0 50 2 Z' fill='%237CB342'/%3E%3Ccircle cx='50' cy='26' r='7.5' fill='%231976D2'/%3E%3Ccircle cx='50' cy='74' r='7.5' fill='%237CB342'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
    :root {
        --page:     #06070d;
        --hairline: #1b2130;
        --hairline-strong: #2b3446;
        --text:     #e8ecf4;
        --text-dim: #8d97ab;
        --text-faint: #5b6577;
        --fc-blue:  #1976D2;
        --fc-green: #7CB342;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
        background-color: var(--page);
        /* Brand-tinted pools of light behind the canvas, so the dark plate is
           never flat even before a single pixel of WebGL lands on it. */
        background-image:
            radial-gradient(60vw 60vw at 22% 18%, rgba(25, 118, 210, .17), transparent 62%),
            radial-gradient(55vw 55vw at 80% 78%, rgba(124, 179, 66, .14), transparent 62%),
            radial-gradient(90vw 70vw at 50% 50%, rgba(10, 14, 26, .55), transparent 70%);
        color: var(--text);
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        font-size: 15px;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
        overscroll-behavior: none;
    }

    #gl-canvas {
        position: fixed;
        inset: 0;
        opacity: 0;
        transition: opacity .9s ease;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
        cursor: grab;
        z-index: 1;
    }
    #gl-canvas.live { opacity: 1; }
    #gl-canvas:active { cursor: grabbing; }

    /* Vignette, above the canvas but transparent to clicks. */
    .vignette {
        position: fixed;
        inset: 0;
        z-index: 2;
        pointer-events: none;
        background: radial-gradient(ellipse 96% 92% at 50% 44%, transparent 62%, rgba(4, 5, 10, .55) 100%);
    }

    .mono {
        font-family: 'IBM Plex Mono', ui-monospace, monospace;
        font-size: 11px;
        letter-spacing: .14em;
        text-transform: uppercase;
    }

    /* ---------- top bar ---------- */

    .hud {
        position: fixed;
        top: 0; left: 0; right: 0;
        z-index: 4;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 20px clamp(16px, 4vw, 34px);
        pointer-events: none;
    }
    .hud > * { pointer-events: auto; }

    .backlink { color: var(--text-faint); text-decoration: none; transition: color .18s; }
    .backlink:hover, .backlink:focus-visible { color: #22d3ee; outline: none; }

    .hud-tag { color: var(--text-faint); text-align: right; }
    .hud-tag b { color: var(--text-dim); font-weight: 500; }

    /* ---------- wordmark + dock ---------- */

    /* The medallion now runs almost the full height, so the wordmark sits over
       its lower edge. This scrim keeps the type readable against it. */
    .stage-foot::before {
        content: '';
        position: absolute;
        inset: auto 0 0 0;
        height: 230px;
        background: linear-gradient(to top, rgba(4,5,10,.92) 0%, rgba(4,5,10,.72) 42%, transparent 100%);
        pointer-events: none;
        z-index: -1;
    }

    .stage-foot {
        position: fixed;
        left: 0; right: 0;
        bottom: 0;
        z-index: 4;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        padding: 0 clamp(12px, 4vw, 28px) calc(16px + env(safe-area-inset-bottom, 0px));
        pointer-events: none;
    }
    .stage-foot > * { pointer-events: auto; }

    .wordmark { text-align: center; user-select: none; }
    .wordmark-line {
        display: flex;
        align-items: baseline;
        justify-content: center;
        font-weight: 900;
        letter-spacing: -.02em;
        font-size: clamp(2.1rem, 8.6vw, 5rem);
        line-height: 1;
        /* A brushed-metal sweep, so the type matches the medallion. */
        background: linear-gradient(100deg, #6ea8dc 0%, #eaf2ff 26%, #9fd06a 52%, #eaf2ff 74%, #5f97cc 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 2px 18px rgba(25, 118, 210, .35));
    }
    .wordmark-dot {
        width: .58em; height: .58em;
        margin: 0 .3em;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--fc-green), var(--fc-blue) 70%);
        box-shadow: 0 0 16px rgba(124, 179, 66, .55);
        align-self: center;
    }
    .wordmark-sub {
        margin-top: 13px;
        color: var(--text-dim);
        font-family: 'IBM Plex Mono', ui-monospace, monospace;
        font-size: clamp(11px, 2.9vw, 15px);
        letter-spacing: .38em;
        text-transform: uppercase;
    }

    .dock {
        display: none;   /* revealed only once the 3D layer is running */
        align-items: center;
    }
    .dock.live {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px 14px;
        padding: 10px 14px;
        border: 1px solid var(--hairline);
        border-radius: 16px;
        background: rgba(10, 12, 20, .72);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        box-shadow: 0 18px 40px -22px rgba(0, 0, 0, .9);
        max-width: 100%;
    }

    .seg { display: flex; gap: 4px; padding: 3px; border-radius: 11px; background: rgba(255,255,255,.04); }

    .seg button {
        appearance: none;
        border: 0;
        border-radius: 8px;
        padding: 7px 11px;
        background: transparent;
        color: var(--text-faint);
        font-family: 'IBM Plex Mono', ui-monospace, monospace;
        font-size: 10.5px;
        letter-spacing: .1em;
        text-transform: uppercase;
        cursor: pointer;
        transition: background .18s, color .18s;
        white-space: nowrap;
    }
    .seg button:hover { color: var(--text); }
    .seg button[aria-pressed="true"] {
        background: linear-gradient(135deg, rgba(25,118,210,.9), rgba(124,179,66,.85));
        color: #05070c;
        font-weight: 500;
    }
    .seg button:focus-visible { outline: 2px solid #22d3ee; outline-offset: 1px; }

    .slider-wrap { display: flex; align-items: center; gap: 9px; color: var(--text-faint); }
    .slider-wrap label { white-space: nowrap; }

    input[type="range"] {
        appearance: none;
        width: clamp(70px, 16vw, 116px);
        height: 3px;
        border-radius: 2px;
        background: linear-gradient(90deg, var(--fc-blue), var(--fc-green));
        outline: none;
        cursor: pointer;
    }
    input[type="range"]::-webkit-slider-thumb {
        appearance: none;
        width: 14px; height: 14px;
        border-radius: 50%;
        background: #eaf2ff;
        box-shadow: 0 0 10px rgba(124,179,66,.7);
        cursor: pointer;
    }
    input[type="range"]::-moz-range-thumb {
        width: 14px; height: 14px;
        border: 0;
        border-radius: 50%;
        background: #eaf2ff;
        box-shadow: 0 0 10px rgba(124,179,66,.7);
        cursor: pointer;
    }

    .divider { width: 1px; align-self: stretch; background: var(--hairline); }

    .readout {
        color: var(--text-faint);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
    }
    .readout b { color: var(--text-dim); font-weight: 500; }


    @media (max-width: 560px) {
        .hud-tag { font-size: 9px; letter-spacing: .08em; }
        .hud-tag .tag-long { display: none; }
        .readout { display: none; }
        .divider { display: none; }
        /* Let every control group wrap rather than push the dock off-screen. */
        .dock.live { width: 100%; gap: 8px; padding: 9px 10px; justify-content: center; }
        .seg { flex-wrap: wrap; justify-content: center; }
        .seg button { padding: 7px 9px; font-size: 10px; }
        .slider-wrap { flex: 1 1 auto; justify-content: center; }
    }

    /* ---------- static mark ----------
       Rendered from the first paint with no WebGL, no modules and no CDN.
       The 3D scene fades this out only once it is genuinely running, so the
       page can never sit on a spinner. */
    .static-mark {
        position: fixed;
        inset: 0;
        z-index: 0;
        display: grid;
        place-items: center;
        transition: opacity .9s ease;
    }
    .static-mark.retired { opacity: 0; pointer-events: none; }

    .static-mark .mark-wrap {
        position: relative;
        width: min(84vh, 93vw);
        aspect-ratio: 1;
        animation: markFloat 9s ease-in-out infinite;
    }
    .static-mark svg {
        width: 100%;
        height: 100%;
        display: block;
        filter:
            drop-shadow(0 0 70px rgba(25, 118, 210, .55))
            drop-shadow(0 0 140px rgba(124, 179, 66, .3))
            drop-shadow(0 26px 60px rgba(0, 0, 0, .85));
    }
    /* A highlight sweeping around the disc, clipped to the circle. */
    .static-mark .sheen {
        position: absolute;
        inset: 1%;
        border-radius: 50%;
        background: conic-gradient(from 0deg,
            transparent 0 14%,
            rgba(255,255,255,.62) 23%,
            rgba(255,255,255,.08) 30%,
            transparent 38% 64%,
            rgba(255,255,255,.34) 72%,
            transparent 80% 100%);
        mix-blend-mode: screen;
        opacity: .55;
        animation: sheenSpin 7s linear infinite;
        pointer-events: none;
    }
    @keyframes sheenSpin { to { transform: rotate(360deg); } }
    @keyframes markFloat {
        0%, 100% { transform: translateY(-1.1%) scale(1); }
        50%      { transform: translateY(1.1%) scale(1.012); }
    }

    /* A non-blocking status chip, so a failure is readable instead of silent. */
    .diag {
        max-width: min(92vw, 620px);
        padding: 9px 14px;
        cursor: pointer;
        border: 1px solid var(--hairline);
        border-radius: 10px;
        background: rgba(10, 12, 20, .9);
        color: var(--text-dim);
        font-family: 'IBM Plex Mono', ui-monospace, monospace;
        font-size: 10.5px;
        line-height: 1.5;
        text-align: center;
        word-break: break-word;
        display: none;
    }
    .diag.show { display: block; }
    .diag b { color: var(--text); font-weight: 500; }
    .diag .detail { display: none; margin-top: 6px; color: var(--text-faint); font-size: 9.5px; }
    .diag.open .detail { display: block; }

    @media (max-height: 760px) {
        .wordmark-line { font-size: clamp(1.6rem, 5.6vw, 2.9rem); }
        .wordmark-sub { font-size: 10px; margin-top: 8px; }
    }

    @media (prefers-reduced-motion: reduce) {
        .static-mark .sheen,
        .static-mark .mark-wrap { animation: none; }
    }
</style>
</head>

<script>
/* Deliberately a classic script, not a module. If the module below fails to
   load - no import-map support, a blocked CDN, a parse error - this still runs
   and reports it on screen, because a tablet has no console to check. */
(function () {
    // Short sentence up front; the raw error only when it is asked for, so the
    // page never shows a wall of text nobody can act on.
    var diag = function (text, detail) {
        var el = document.getElementById('diag');
        if (!el) return;
        el.innerHTML = '';
        var line = document.createElement('div');
        line.innerHTML = '<b>Flat mark shown.</b> ' + text + (detail ? ' &nbsp;<span style="opacity:.6">(tap for details)</span>' : '');
        el.appendChild(line);
        if (detail) {
            var d = document.createElement('div');
            d.className = 'detail';
            d.textContent = String(detail).slice(0, 400);
            el.appendChild(d);
            el.onclick = function () { el.classList.toggle('open'); };
        }
        el.classList.add('show');
    };
    window.__fcDiag = diag;
    window.__fcReady = false;

    window.addEventListener('error', function (e) {
        if (window.__fcReady) return;
        var src = e && e.target && (e.target.src || e.target.href);
        diag(src ? 'A 3D library could not be downloaded.' : 'The 3D layer hit a script error.',
             src || (e && e.message) || 'script error');
    }, true);

    window.addEventListener('unhandledrejection', function (e) {
        if (window.__fcReady) return;
        diag('The 3D layer failed to start.', (e.reason && (e.reason.message || e.reason)) || 'load failed');
    });

    if (!HTMLScriptElement.supports || !HTMLScriptElement.supports('importmap')) {
        diag('This browser cannot load the 3D libraries (no import-map support).', 'HTMLScriptElement.supports(importmap) === false');
    }

    // If the scene has not come up in eight seconds, say so rather than
    // leaving the page looking like it is still thinking.
    setTimeout(function () {
        if (!window.__fcReady) {
            var el = document.getElementById('diag');
            if (el && !el.classList.contains('show')) {
                diag('The 3D layer did not start in time - the library CDN may be slow or blocked.', 'watchdog: 8s elapsed, scene never rendered');
            }
        }
    }, 8000);
})();
</script>

/* Each SVG element carries a data-layer tag naming its slab. Stacking those
   slabs at different depths turns a flat mark into a struck medallion: the
   gear ring sits at the back, the white face plate is recessed into it, and
   the swoosh, droplets and pictograms rise proud of that in turn. */
const LAYERS = {
    gearRing:    { depth: 15, front: 9.2,  bevelThickness: 1.5,  bevelSize: 1.25, curveSegments: 64 },
    rivet:       { depth: 9,  front: 10.4, bevelThickness: 0.26, bevelSize: 0.22, curveSegments: 12 },
    whiteDisc:   { depth: 13, front: 7.6,  bevelThickness: 1.2,  bevelSize: 1.0,  curveSegments: 64 },
    greenSwoosh: { depth: 15, front: 9.6,  bevelThickness: 1.05, bevelSize: 0.9,  curveSegments: 48 },
    droplet:     { depth: 18, front: 11.6, bevelThickness: 0.22, bevelSize: 0.18, curveSegments: 12 },
    pictogram:   { depth: 19, front: 12.8, bevelThickness: 0.4,  bevelSize: 0.34, curveSegments: 10 }
};
const RING_TEXT_RADIUS = 42.6; // svg units — inside the rivet ring, on the solid backing plate, clear of the gear teeth (which start at r≈45.6)

// Droplets always read as polished liquid mercury — beaded, mirror-bright
// metal — regardless of which finish tab is selected; see buildLogo/applyFinish.
const LIQUID_MERCURY = { metalness: 1, roughness: 0.06, clearcoat: 1, clearcoatRoughness: 0.02, envMapIntensity: 1.6, iridescence: 0, transmission: 0, reflectivity: 0.85 };

const FINISHES = {
    enamel: {
        label: 'Enamel',
        params: { metalness: 0.0, roughness: 0.33, clearcoat: 0.55, clearcoatRoughness: 0.12, envMapIntensity: 0.32, iridescence: 0, transmission: 0, reflectivity: 0.45 },
        lift: 0, bloom: 0.3
    },
    chrome: {
        label: 'Chrome',
        params: { metalness: 1, roughness: 0.14, clearcoat: 1, clearcoatRoughness: 0.04, envMapIntensity: 1.35, iridescence: 0, transmission: 0, reflectivity: 0.6 },
        lift: 0.26, bloom: 0.4
    },
    oilslick: {
        label: 'Oil Slick',
        params: { metalness: 1, roughness: 0.08, clearcoat: 1, clearcoatRoughness: 0.03, envMapIntensity: 1.5, iridescence: 1, iridescenceIOR: 1.8, transmission: 0, reflectivity: 0.7 },
        lift: 0.1, bloom: 0.5
    },
    glass: {
        label: 'Glass',
        params: { metalness: 0, roughness: 0.06, clearcoat: 1, clearcoatRoughness: 0.02, envMapIntensity: 1.5, iridescence: 0, transmission: 1, thickness: 5.5, ior: 1.52, reflectivity: 0.9 },
        lift: 0.18, bloom: 0.45
    }
};

const BRAND = { blue: '#1976D2', green: '#7CB342' };
const LOGO_RADIUS = 5.4;            // the medallion itself, in world units
const RING_RADIUS = 6.35;           // accent rings; kept clear of the disc face
const FRAME_RADIUS = 5.6;           // frame the medallion, not the rings
// Barely any breathing room: the mark should dominate the page.
const FRAME_MARGIN = { landscape: 1.22, portrait: 1.08 };
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

let renderer, scene, camera, controls, composer, bloomPass;
let logoGroup, logoPivot, lightRig, starField, halo, ringGroup;
let materials = [];
let ringWords = [];
let ringWordFrame = 0;
let dropletAnims = [];
let currentFinish = 'enamel';
let autoSpin = !reduceMotion;
let shineScale = 0.62;
let flash = 0;
let spinImpulse = 0;

// Coarse pointers are phones and tablets; give their GPUs some headroom.
const coarsePointer = window.matchMedia('(pointer: coarse)').matches;
function pixelRatioCap() {
    return Math.min(window.devicePixelRatio || 1, coarsePointer ? 1.5 : 2);
}

const clock = new THREE.Clock();
const pointer = new THREE.Vector2();
const parallax = new THREE.Vector2();

try {
    init();
} catch (err) {
    if (window.__fcDiag) window.__fcDiag('The 3D layer could not start.', err && err.message ? err.message : err);
}

function init() {
    const canvas = document.getElementById('gl-canvas');

    try {
        renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: 'high-performance' });
    } catch (err) {
        if (window.__fcDiag) window.__fcDiag('WebGL is unavailable in this browser.', err && err.message);
        return;
    }

    renderer.setPixelRatio(pixelRatioCap());
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.NeutralToneMapping;   // preserves brand hue; ACES washed it out
    renderer.toneMappingExposure = 0.82;

    scene = new THREE.Scene();

    camera = new THREE.PerspectiveCamera(30, window.innerWidth / window.innerHeight, 0.1, 400);
    camera.position.set(2.8, 1.5, 20);

    // A room probe gives the metal something real to reflect. Without it,
    // "shiny" collapses into a flat specular dot.
    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
    pmrem.dispose();

    // Order matters: buildComposer creates bloomPass, and buildLogo ends by
    // calling applyFinish, which sets bloom strength. Composer goes first.
    buildComposer();
    buildLights();
    buildStars();
    buildHalo();
    buildLogo();
    buildRingText();
    buildRings();
    buildControls();
    buildUI();

    window.addEventListener('resize', onResize);
    window.addEventListener('pointermove', onPointerMove, { passive: true });
    canvas.addEventListener('pointerdown', onPointerDown);
    canvas.addEventListener('pointerup', onPointerUp);
    document.addEventListener('keydown', onKeyDown);

    frameCamera();
    onResize();

    // Only now, with a scene that actually renders, hand over from the flat mark.
    renderer.render(scene, camera);
    window.__fcReady = true;
    canvas.classList.add('live');
    document.querySelector('.dock').classList.add('live');
    document.getElementById('staticMark').classList.add('retired');
    renderer.setAnimationLoop(animate);
}

function buildLights() {
    scene.add(new THREE.AmbientLight(0x8fa2c4, 0.16));

    // The rig rotates as a unit, so highlights sweep across the bevels
    // instead of sitting still — that travelling glint is most of the "shine".
    lightRig = new THREE.Group();
    scene.add(lightRig);

    const key = new THREE.DirectionalLight(0xffffff, 0.62);
    key.position.set(-7, 7, 13);
    lightRig.add(key);

    const cyan = new THREE.PointLight(0x22d3ee, 80, 70, 2);
    cyan.position.set(-11, -5, 9);
    lightRig.add(cyan);

    const violet = new THREE.PointLight(0xa855f7, 62, 70, 2);
    violet.position.set(12, -8, 5);
    lightRig.add(violet);

    const lime = new THREE.PointLight(0x9fd06a, 55, 70, 2);
    lime.position.set(-4, 12, -6);
    lightRig.add(lime);

    const backGlow = new THREE.PointLight(0x1976D2, 70, 80, 2);
    backGlow.position.set(0, 0, -16);
    scene.add(backGlow);
}

function buildStars() {
    const COUNT = 2000;
    const positions = new Float32Array(COUNT * 3);
    const colors = new Float32Array(COUNT * 3);
    const palette = [new THREE.Color('#eaf2ff'), new THREE.Color(BRAND.blue), new THREE.Color(BRAND.green), new THREE.Color('#22d3ee')];

    for (let i = 0; i < COUNT; i++) {
        // Even spread over a spherical shell well behind the medallion.
        const u = Math.random() * 2 - 1;
        const theta = Math.random() * Math.PI * 2;
        const r = 34 + Math.random() * 62;
        const s = Math.sqrt(1 - u * u);
        positions[i * 3] = r * s * Math.cos(theta);
        positions[i * 3 + 1] = r * s * Math.sin(theta);
        positions[i * 3 + 2] = r * u;

        const c = palette[Math.random() < 0.72 ? 0 : 1 + Math.floor(Math.random() * 3)];
        colors[i * 3] = c.r; colors[i * 3 + 1] = c.g; colors[i * 3 + 2] = c.b;
    }

    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    starField = new THREE.Points(geo, new THREE.PointsMaterial({
        size: 0.8,
        sizeAttenuation: true,
        vertexColors: true,
        transparent: true,
        opacity: 0.92,
        depthWrite: false,
        blending: THREE.AdditiveBlending
    }));
    scene.add(starField);
}

function buildHalo() {
    // A painted glow well behind the mark, so the stage reads as lit space
    // rather than a black void with an object floating in it.
    const c = document.createElement('canvas');
    c.width = c.height = 512;
    const ctx = c.getContext('2d');
    const g = ctx.createRadialGradient(256, 256, 0, 256, 256, 256);
    g.addColorStop(0.00, 'rgba(96, 156, 230, 0.55)');
    g.addColorStop(0.28, 'rgba(25, 118, 210, 0.3)');
    g.addColorStop(0.58, 'rgba(124, 179, 66, 0.14)');
    g.addColorStop(1.00, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, 512, 512);

    const texture = new THREE.CanvasTexture(c);
    texture.colorSpace = THREE.SRGBColorSpace;

    halo = new THREE.Mesh(
        new THREE.PlaneGeometry(30, 30),
        new THREE.MeshBasicMaterial({
            map: texture,
            transparent: true,
            depthWrite: false,
            blending: THREE.AdditiveBlending,
            opacity: 0.26
        })
    );
    halo.position.z = -19;
    scene.add(halo);
}

function buildRings() {
    // Two slim chrome rings give the medallion a sense of scale and keep
    // something moving in the outer frame.
    ringGroup = new THREE.Group();
    logoPivot.add(ringGroup);

    const ringMaterial = new THREE.MeshPhysicalMaterial({
        color: new THREE.Color('#dfe9f7'),
        metalness: 1,
        roughness: 0.2,
        clearcoat: 1,
        envMapIntensity: 1.1
    });

    const outer = new THREE.Mesh(new THREE.TorusGeometry(RING_RADIUS, 0.075, 16, 220), ringMaterial);
    outer.rotation.x = 0.16;
    ringGroup.add(outer);

    const inner = new THREE.Mesh(
        new THREE.TorusGeometry(RING_RADIUS - 0.34, 0.045, 14, 200),
        new THREE.MeshPhysicalMaterial({
            color: new THREE.Color(BRAND.green),
            metalness: 1,
            roughness: 0.26,
            envMapIntensity: 0.9
        })
    );
    inner.rotation.x = -0.13;
    inner.rotation.y = 0.17;
    ringGroup.add(inner);
}

function buildLogo() {
    const paths = new SVGLoader().parse(LOGO_SVG).paths;

    logoPivot = new THREE.Group();
    scene.add(logoPivot);

    logoGroup = new THREE.Group();
    logoPivot.add(logoGroup);

    let triangles = 0;
    dropletAnims = [];

    paths.forEach((path) => {
        const key = path.userData.node.getAttribute('data-layer') || 'pictogram';
        const layer = LAYERS[key] || LAYERS.pictogram;
        const shapes = path.toShapes();
        const isDroplet = key === 'droplet';

        const material = new THREE.MeshPhysicalMaterial({
            color: new THREE.Color(path.color),
            side: THREE.DoubleSide,   // the y-flip below reverses winding
            ...(isDroplet ? LIQUID_MERCURY : FINISHES[currentFinish].params)
        });
        material.userData.baseColor = new THREE.Color(path.color);
        if (isDroplet) {
            // Water-blue, but with mercury's mirror-bright, always-shiny
            // physical params (see LIQUID_MERCURY) so the beads stay glossy
            // and liquid-looking regardless of the finish tab (see the skip
            // in applyFinish) — colour of water, shine and motion of mercury.
            material.color.set('#bfe3fb');
            material.userData.liquidMercury = true;
        }
        materials.push(material);

        shapes.forEach((shape) => {
            const geometry = new THREE.ExtrudeGeometry(shape, {
                depth: layer.depth,
                bevelEnabled: true,
                bevelThickness: layer.bevelThickness,
                bevelSize: layer.bevelSize,
                bevelSegments: 4,
                curveSegments: layer.curveSegments || 48
            });

            // SVG origin is top-left; recentre on the artboard midpoint.
            geometry.translate(-50, -50, layer.front - layer.depth);
            geometry.computeVertexNormals();
            triangles += geometry.index ? geometry.index.count / 3 : geometry.attributes.position.count / 3;

            if (isDroplet) {
                // Droplets animate independently (see animate()), which needs
                // each one's geometry centred on its own bead rather than on
                // the medallion's centre — otherwise scaling or nudging the
                // mesh would drag it toward/away from the middle instead of
                // moving it in place.
                geometry.computeBoundingBox();
                const center = new THREE.Vector3();
                geometry.boundingBox.getCenter(center);
                geometry.translate(-center.x, -center.y, -center.z);

                const mesh = new THREE.Mesh(geometry, material);
                mesh.position.copy(center);
                logoGroup.add(mesh);

                dropletAnims.push({
                    mesh,
                    base: center.clone(),
                    // svg-units/second and svg-units respectively — a slow,
                    // ambient trickle rather than an obvious animation.
                    speed: 0.35 + Math.random() * 0.35,
                    range: 6 + Math.random() * 6,
                    phase: Math.random() * 40,
                    wobble: 0.4 + Math.random() * 0.5,
                    wobblePhase: Math.random() * Math.PI * 2
                });
            } else {
                logoGroup.add(new THREE.Mesh(geometry, material));
            }
        });
    });

    // SVG's y axis points down, so mirror it. DoubleSide above covers the
    // winding that the negative scale reverses.
    const s = (LOGO_RADIUS * 2) / 100;
    logoGroup.scale.set(s, -s, s);

    document.getElementById('tris').textContent = Math.round(triangles).toLocaleString();
    applyFinish(currentFinish);
}

/* The ring words (SWIM / BIKE / RUN / EAT / SLEEP / REPEAT) are painted, not
   extruded — SVGLoader has no notion of <text>, and curved 3D letterforms
   are not worth the weight here. Each word is its own canvas-texture plane,
   parented to logoPivot (not the y-flipped logoGroup) so ordinary screen-
   space angles place them, and it spins with the medallion regardless.
   Each also gets a metallic brand-colour sweep plus a moving specular band
   repainted every frame (see paintRingWord/animate), so the type shines and
   glimmers the same way the wordmark below the medallion does. */
function buildRingText() {
    const s = (LOGO_RADIUS * 2) / 100;
    const worldRadius = RING_TEXT_RADIUS * s;
    // Extrusion bevels push the ring's true front lip out past `front` by
    // roughly `bevelThickness`; clear that or the words sit behind the teeth.
    const worldZ = (LAYERS.gearRing.front + LAYERS.gearRing.bevelThickness) * s + 0.12;
    const words = ['SWIM', 'BIKE', 'RUN', 'EAT', 'SLEEP', 'REPEAT'];
    ringWords = [];

    words.forEach((word, i) => {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        ctx.font = '800 84px Inter, sans-serif';
        const textWidth = ctx.measureText(word).width;
        canvas.width = Math.ceil(textWidth + 40);
        canvas.height = 128;

        const texture = new THREE.CanvasTexture(canvas);
        texture.colorSpace = THREE.SRGBColorSpace;
        texture.anisotropy = renderer.capabilities.getMaxAnisotropy();

        // Kept small enough to sit on the gear's solid backing plate, clear
        // of the tooth notches that start around r≈45.6 svg units.
        const planeHeight = 0.56;
        const planeWidth = planeHeight * (canvas.width / canvas.height);
        const mesh = new THREE.Mesh(
            new THREE.PlaneGeometry(planeWidth, planeHeight),
            new THREE.MeshBasicMaterial({ map: texture, transparent: true, depthWrite: false })
        );

        // Evenly spaced, clockwise from the top — SWIM at 12 o'clock.
        const angle = Math.PI / 2 - (i / words.length) * Math.PI * 2;
        mesh.position.set(worldRadius * Math.cos(angle), worldRadius * Math.sin(angle), worldZ);
        mesh.rotation.z = angle - Math.PI / 2;
        logoPivot.add(mesh);

        const rw = { canvas, ctx, word, texture, phase: i * 0.61 };
        paintRingWord(rw, 0);
        ringWords.push(rw);
    });
}

// Repaints one ring word: a fixed blue/white/green metal sweep (matching the
// wordmark's CSS gradient) plus a specular band that travels across the
// letterforms over time, composited with 'source-atop' so it never leaks
// past the glyph outlines.
function paintRingWord(rw, t) {
    const { canvas, ctx, word } = rw;
    const w = canvas.width, h = canvas.height;
    ctx.clearRect(0, 0, w, h);
    ctx.font = '800 84px Inter, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    const base = ctx.createLinearGradient(0, 0, w, 0);
    base.addColorStop(0.00, '#5f97cc');
    base.addColorStop(0.26, '#eaf2ff');
    base.addColorStop(0.52, '#9fd06a');
    base.addColorStop(0.74, '#eaf2ff');
    base.addColorStop(1.00, '#6ea8dc');
    ctx.fillStyle = base;
    ctx.fillText(word, w / 2, h / 2 + 4);

    if (!reduceMotion) {
        ctx.globalCompositeOperation = 'source-atop';
        const sweep = ((t * 0.16 + rw.phase) % 1 + 1) % 1;
        const cx = -w * 0.4 + sweep * w * 1.8;
        const band = ctx.createLinearGradient(cx - w * 0.22, 0, cx + w * 0.22, 0);
        band.addColorStop(0, 'rgba(255,255,255,0)');
        band.addColorStop(0.5, 'rgba(255,255,255,0.95)');
        band.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = band;
        ctx.fillRect(0, 0, w, h);
        ctx.globalCompositeOperation = 'source-over';
    }

    rw.texture.needsUpdate = true;
}

function buildComposer() {
    composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));

    bloomPass = new UnrealBloomPass(
        new THREE.Vector2(window.innerWidth, window.innerHeight),
        FINISHES[currentFinish].bloom, 0.5, 0.92
    );
    composer.addPass(bloomPass);
    composer.addPass(new OutputPass());
}

function buildControls() {
    controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.07;
    controls.enablePan = false;
    controls.target.set(0, -0.7, 0);
    controls.minDistance = 8;
    controls.maxDistance = 60;
    controls.rotateSpeed = 0.75;
    controls.zoomSpeed = 0.7;
    controls.autoRotate = autoSpin;
    controls.autoRotateSpeed = 1.15;
}

/* ---------------- UI ---------------- */

function buildUI() {
    const seg = document.getElementById('finishSeg');
    seg.innerHTML = Object.entries(FINISHES).map(([key, f]) =>
        `<button type="button" data-finish="${key}" aria-pressed="${key === currentFinish}">${f.label}</button>`
    ).join('');

    seg.addEventListener('click', (e) => {
        const btn = e.target.closest('button[data-finish]');
        if (!btn) return;
        applyFinish(btn.dataset.finish);
    });

    const shine = document.getElementById('shine');
    shine.addEventListener('input', () => {
        shineScale = Number(shine.value) / 100;
        setBloom();
    });

    const spinBtn = document.getElementById('spinBtn');
    spinBtn.setAttribute('aria-pressed', String(autoSpin));
    spinBtn.addEventListener('click', () => {
        autoSpin = !autoSpin;
        controls.autoRotate = autoSpin;
        spinBtn.setAttribute('aria-pressed', String(autoSpin));
    });

    document.getElementById('resetBtn').addEventListener('click', resetView);
}

// Single place that writes bloom strength, and the only one that has to know
// whether the composer exists yet.
function setBloom(extra) {
    if (!bloomPass) return;
    const base = (FINISHES[currentFinish] || FINISHES.enamel).bloom;
    bloomPass.strength = (base * shineScale / 0.62) + (extra || 0);
}

function applyFinish(key) {
    const finish = FINISHES[key];
    if (!finish) return;
    currentFinish = key;

    materials.forEach((material) => {
        // Droplets are always polished liquid mercury, independent of the
        // selected finish — see the LIQUID_MERCURY override in buildLogo.
        if (material.userData.liquidMercury) return;

        // Reset the properties a previous finish may have set, so switching
        // back and forth cannot accumulate leftovers.
        material.iridescence = 0;
        material.transmission = 0;
        material.thickness = 0;
        Object.assign(material, finish.params);

        // Metals read almost black under tone mapping unless the base colour
        // is lifted toward the light it reflects.
        const c = material.userData.baseColor.clone();
        if (finish.lift > 0) c.lerp(new THREE.Color(0xffffff), finish.lift);
        material.color.copy(c);
        material.needsUpdate = true;
    });

    setBloom();

    document.querySelectorAll('#finishSeg button').forEach((b) =>
        b.setAttribute('aria-pressed', String(b.dataset.finish === key)));
}

function resetView() {
    controls.reset();
    camera.position.set(0, 0, 26);
    frameCamera();
    logoPivot.rotation.set(0, 0, 0);
    spinImpulse = 0;
}

/* ---------------- events ---------------- */

let dragStart = null;

function onPointerMove(e) {
    pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
    pointer.y = (e.clientY / window.innerHeight) * 2 - 1;
}

function onPointerDown(e) { dragStart = { x: e.clientX, y: e.clientY, t: performance.now() }; }

function onPointerUp(e) {
    if (!dragStart) return;
    const moved = Math.hypot(e.clientX - dragStart.x, e.clientY - dragStart.y);
    const quick = performance.now() - dragStart.t < 400;
    // A tap (not a drag) strikes the medallion: flare the bloom and spin it.
    if (moved < 6 && quick) {
        flash = 1;
        spinImpulse = 5.2;
    }
    dragStart = null;
}

function onKeyDown(e) {
    if (e.key === ' ') {
        e.preventDefault();
        document.getElementById('spinBtn').click();
    } else if (e.key.toLowerCase() === 'r') {
        resetView();
    }
}

function frameCamera() {
    // Keep the mark and its rings on screen at any aspect, including tall
    // phones, with only a sliver of margin so it fills the page.
    const vFov = THREE.MathUtils.degToRad(camera.fov);
    const need = FRAME_RADIUS / Math.tan(vFov / 2);
    const aspect = camera.aspect;
    const portrait = aspect < 1;
    const margin = portrait ? FRAME_MARGIN.portrait : FRAME_MARGIN.landscape;
    const distance = THREE.MathUtils.clamp((portrait ? need / aspect : need) * margin, 8, 60);

    const target = controls ? controls.target : new THREE.Vector3();
    const dir = camera.position.clone().sub(target);
    if (dir.lengthSq() < 1e-6) dir.set(3.1, 1.7, 22);
    dir.normalize();

    camera.position.copy(dir.multiplyScalar(distance).add(target));
    camera.lookAt(target);
    controls?.update();
}

function onResize() {
    const w = window.innerWidth, h = window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setPixelRatio(pixelRatioCap());
    renderer.setSize(w, h);
    composer.setSize(w, h);   // resizes every pass, bloom included
    frameCamera();
}

/* ---------------- loop ---------------- */

let fpsFrames = 0, fpsLast = performance.now();

function animate() {
    const dt = Math.min(clock.getDelta(), 0.05);
    const t = clock.elapsedTime;

    // Ease the pointer into a parallax tilt rather than snapping to it.
    parallax.x += (pointer.x - parallax.x) * 0.045;
    parallax.y += (pointer.y - parallax.y) * 0.045;

    if (logoPivot) {
        const idle = reduceMotion ? 0 : 1;
        spinImpulse *= 0.94;
        logoPivot.rotation.y += spinImpulse * dt;
        logoPivot.rotation.x = parallax.y * 0.22 + Math.sin(t * 0.45) * 0.05 * idle;
        logoPivot.rotation.z = -parallax.x * 0.1 + Math.sin(t * 0.33) * 0.03 * idle;
        logoPivot.position.y = Math.sin(t * 0.62) * 0.28 * idle;
    }

    if (lightRig && !reduceMotion) {
        lightRig.rotation.z = t * 0.22;
        lightRig.rotation.y = Math.sin(t * 0.3) * 0.35;
    }

    if (starField) {
        starField.rotation.y += dt * 0.012;
        starField.rotation.x += dt * 0.005;
    }

    if (ringGroup && !reduceMotion) {
        ringGroup.rotation.z = t * 0.16;
        ringGroup.children[0].rotation.z = t * 0.28;
        ringGroup.children[1].rotation.z = -t * 0.36;
    }

    if (halo) {
        halo.material.opacity = 0.24 + Math.sin(t * 0.7) * 0.05 + flash * 0.3;
        halo.rotation.z = t * 0.04;
    }

    // Repainted every other frame — plenty smooth for a slow specular sweep,
    // at half the canvas-text cost of doing it every frame.
    if (ringWords.length && !reduceMotion) {
        ringWordFrame++;
        if (ringWordFrame % 2 === 0) ringWords.forEach((rw) => paintRingWord(rw, t));
    }

    // Droplets bead, drip down the face and splash away, then reform at the
    // top — each on its own speed/length/phase so they read as independent
    // liquid rather than one shape sliding on a loop. The scale fade at both
    // ends of a cycle (see `edge`) hides the position reset: a drop shrinks
    // to nothing right as it "splashes" and grows back in as a fresh bead.
    if (dropletAnims.length && !reduceMotion) {
        dropletAnims.forEach((d) => {
            const progress = ((t * d.speed + d.phase) % d.range + d.range) % d.range;
            const edge = d.range * 0.12;
            let scale = 1;
            if (progress < edge) scale = progress / edge;
            else if (progress > d.range - edge) scale = (d.range - progress) / edge;
            scale = Math.max(0.001, scale);

            // A little lateral/vertical jiggle as it slides, like surface
            // tension wobbling a bead rather than a rigid drip.
            const wob = Math.sin(t * 3.2 + d.wobblePhase) * 0.12 * d.wobble;
            d.mesh.position.set(d.base.x, d.base.y + progress, d.base.z);
            d.mesh.scale.set(scale * (1 + wob), scale * (1 - wob), scale);
        });
    }

    if (flash > 0.001) {
        flash *= 0.9;
        setBloom(flash * 1.5);
    }

    controls.update();
    composer.render();

    fpsFrames++;
    const now = performance.now();
    if (now - fpsLast >= 1000) {
        document.getElementById('fps').textContent = Math.round((fpsFrames * 1000) / (now - fpsLast));
        fpsFrames = 0;
        fpsLast = now;
    }
}
</script>
</body>
</html>
