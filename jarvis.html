<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="description" content="J.A.R.V.I.S. Demo: a talking assistant that runs entirely in your browser, with an animated orb, voice in and out, jokes, fun facts, simple math, coin flips, dice and a launch countdown.">
<title>J.A.R.V.I.S. Demo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='16' fill='%23020a06'/%3E%3Ccircle cx='50' cy='50' r='30' fill='none' stroke='%2339ff88' stroke-width='6'/%3E%3Ccircle cx='50' cy='50' r='12' fill='%2339ff88'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --void:#020a06; --deep:#06170e; --phos:#39ff88; --phos-dim:#1b7a45; --label:#2fa862;
  --glass:rgba(57,255,136,.06); --amber:#ffc24a; --text:#c9ffe0;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{
  background:radial-gradient(ellipse at 50% 38%,var(--deep) 0%,var(--void) 70%);
  color:var(--text);font-family:"Chakra Petch",ui-monospace,"Segoe UI",system-ui,sans-serif;
  display:flex;flex-direction:column;overflow:hidden;
}
body::after{ /* scan lines */
  content:"";position:fixed;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(57,255,136,.035) 0 1px,transparent 1px 3px);
}
header{display:flex;justify-content:space-between;align-items:flex-start;padding:14px 18px;font-size:.8rem;color:var(--label);letter-spacing:.04em}
header b{display:block;color:var(--phos);font-size:1.4rem;font-weight:500;letter-spacing:.02em}
header a{color:var(--label);text-decoration:none}
header a:hover,header a:focus-visible{color:var(--phos)}
header a:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
#core{flex:1;display:grid;place-items:center;min-height:0;position:relative}
canvas{width:min(78vw,52vh,420px);aspect-ratio:1;display:block}
#state{position:absolute;bottom:4%;font-size:.85rem;color:var(--phos);opacity:.8;letter-spacing:.2em}
#log{height:26vh;overflow-y:auto;padding:0 18px;display:flex;flex-direction:column;gap:8px;max-width:640px;width:100%;margin:0 auto;scroll-behavior:smooth}
.msg{max-width:85%;padding:8px 12px;border:1px solid var(--phos-dim);background:var(--glass);font-size:1rem;line-height:1.4;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px))}
.me{align-self:flex-end;border-color:var(--amber);color:#ffe6b0;background:rgba(255,194,74,.06)}
.ai{align-self:flex-start}
form{display:flex;gap:10px;padding:14px 18px 18px;max-width:640px;width:100%;margin:0 auto}
input{flex:1;min-width:0;background:var(--glass);border:1px solid var(--phos-dim);color:var(--text);font:inherit;font-size:1rem;padding:12px 14px;outline:none}
input::placeholder{color:var(--label);opacity:1}
input:focus-visible{border-color:var(--phos)}
button{font:inherit;cursor:pointer;border:1px solid var(--phos);background:transparent;color:var(--phos);padding:0 16px;font-weight:700}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
#mic{width:52px;border-radius:50%;font-size:1.3rem;padding:0}
#mic.on{background:var(--phos);color:var(--void)}
#clock-box{text-align:right}
@media (prefers-reduced-motion:reduce){#log{scroll-behavior:auto}}
</style>
</head>
<body>
<header>
  <div><b>J.A.R.V.I.S.</b>Demo build · no internet brain · <a href="index.html">← Fun</a></div>
  <div id="clock-box"><b id="clock">--:--</b><span id="date"></span></div>
</header>

<div id="core"><canvas id="orb" width="840" height="840"></canvas><div id="state">STANDBY</div></div>

<div id="log" aria-live="polite"></div>

<form id="f">
  <button type="button" id="mic" aria-label="Talk to Jarvis">🎙</button>
  <input id="q" placeholder="Ask me something…" autocomplete="off" aria-label="Message">
  <button type="submit">Send</button>
</form>

<script>
/* ---------- Clock ---------- */
const clock=document.getElementById('clock'),dateEl=document.getElementById('date');
function tick(){const d=new Date();clock.textContent=d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});dateEl.textContent=d.toLocaleDateString([], {weekday:'long',month:'short',day:'numeric'})}
tick();setInterval(tick,1000);

/* ---------- Orb ---------- */
const cv=document.getElementById('orb'),cx=cv.getContext('2d'),stateEl=document.getElementById('state');
let mode='idle',energy=0;
const reduce=!!window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function setMode(m){mode=m;stateEl.textContent={idle:'STANDBY',listen:'LISTENING',think:'PROCESSING',speak:'SPEAKING'}[m]}
function draw(t){
  const W=cv.width,c=W/2;cx.clearRect(0,0,W,W);
  const target={idle:.15,listen:.6,think:.45,speak:.9}[mode];
  energy+=(target-energy)*.06;
  const pulse=energy*(0.6+0.4*Math.sin(t/(mode==='speak'?90:400)));
  // glow core
  const g=cx.createRadialGradient(c,c,0,c,c,W*.22);
  g.addColorStop(0,`rgba(180,255,210,${.55+pulse*.4})`);g.addColorStop(.35,`rgba(57,255,136,${.25+pulse*.3})`);g.addColorStop(1,'rgba(57,255,136,0)');
  cx.fillStyle=g;cx.beginPath();cx.arc(c,c,W*.22,0,7);cx.fill();
  // rings
  const rings=[[.16,6,1.2,.9],[.24,3,-.7,.6],[.31,12,.4,.5],[.38,2,-.25,.35],[.45,40,.1,.25]];
  rings.forEach(([r,segs,spd,a],i)=>{
    const R=W*r*(1+pulse*.04*(i%2?1:-1)),rot=reduce?0:t/1000*spd*(1+energy*2);
    cx.strokeStyle=`rgba(57,255,136,${a+pulse*.3})`;cx.lineWidth=i===4?2:i===0?10:4;
    const gap=segs>20?.06:.25;
    for(let s=0;s<segs;s++){const a0=rot+s*Math.PI*2/segs;cx.beginPath();cx.arc(c,c,R,a0,a0+Math.PI*2/segs-gap);cx.stroke()}
  });
  // tick marks
  cx.strokeStyle='rgba(57,255,136,.4)';cx.lineWidth=2;
  for(let i=0;i<72;i++){const a=i*Math.PI/36,r1=W*.48,r2=W*(i%6?.47:.455);cx.beginPath();cx.moveTo(c+Math.cos(a)*r1,c+Math.sin(a)*r1);cx.lineTo(c+Math.cos(a)*r2,c+Math.sin(a)*r2);cx.stroke()}
  requestAnimationFrame(draw);
}
if(cx)requestAnimationFrame(draw); // no 2D canvas (e.g. jsdom): skip the orb, the chat still works

/* ---------- Voice out ---------- */
const synth=window.speechSynthesis||null;
let voice=null;
function pickVoice(){const v=synth.getVoices();voice=v.find(x=>/en-GB/i.test(x.lang)&&/male|daniel|arthur|george/i.test(x.name))||v.find(x=>/en-GB/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang))||null}
if(synth){pickVoice();synth.onvoiceschanged=pickVoice}
function say(text){
  add(text,'ai');
  if(!synth){setMode('idle');return}
  const u=new SpeechSynthesisUtterance(text);if(voice)u.voice=voice;u.rate=1.02;u.pitch=.9;
  u.onstart=()=>setMode('speak');u.onend=u.onerror=()=>setMode('idle');
  synth.cancel();synth.speak(u);
  // Some browsers never start speaking (no voices installed); don't stay stuck on PROCESSING.
  setTimeout(()=>{if(mode==='think')setMode('idle')},1500);
}

/* ---------- Chat log ---------- */
const log=document.getElementById('log');
function add(text,who){const d=document.createElement('div');d.className='msg '+who;d.textContent=text;log.appendChild(d);log.scrollTop=log.scrollHeight}

/* ---------- Built-in brain (no internet, kid-safe) ---------- */
let userName=null;try{userName=localStorage.getItem('jarvis-name')}catch(e){}
const pick=a=>a[Math.floor(Math.random()*a.length)];
const jokes=["Why did the robot go on vacation? It needed to recharge its batteries.","What do you call a computer that sings? A Dell.","Why was the math book sad? It had too many problems.","How does the moon cut its hair? Eclipse it.","Why don't skeletons fight each other? They don't have the guts."];
const facts=["Octopuses have three hearts.","A day on Venus is longer than a year on Venus.","Honey never spoils. Archaeologists have found edible honey in ancient Egyptian tombs.","Sharks existed before trees did.","The Eiffel Tower grows about 15 centimeters taller in summer because the metal expands."];
const nums={zero:0,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12};
// "I'm happy" / "I am fine" are not names.
const notNames=new Set(['fine','good','great','ok','okay','happy','sad','tired','bored','hungry','sorry','here','back','ready','not','so','very','just','doing','going','feeling','a','an','the','still','well','sick','cold','hot','excited','done','sure','in','on','at','from','with','your','listening','scared','mad','angry','sleepy','thirsty','awesome','cool','alright','busy','lost','confused','home','learning','trying','playing','looking','talking']);
function mathAnswer(s){
  s=s.replace(/\b(zero|one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve)\b/g,m=>nums[m])
     .replace(/\b(times|multiplied by|x)\b/g,'*').replace(/\b(plus|add)\b/g,'+').replace(/\b(minus|take away)\b/g,'-').replace(/\b(divided by|over)\b/g,'/');
  const m=s.match(/(-?\d+(?:\.\d+)?)\s*([+\-*/])\s*(-?\d+(?:\.\d+)?)/);if(!m)return null;
  const a=+m[1],b=+m[3],r={'+':a+b,'-':a-b,'*':a*b,'/':b===0?null:a/b}[m[2]];
  return r===null?"Dividing by zero would tear a hole in the universe. Let's not.":`That would be ${+r.toFixed(4)}.`;
}
function brain(raw){
  const s=raw.toLowerCase().trim(),name=userName?`, ${userName}`:'';
  let m;
  if((m=s.match(/\b(?:my name is|call me|i am|i'm) ([a-z]+)/))&&!notNames.has(m[1])){userName=m[1][0].toUpperCase()+m[1].slice(1);try{localStorage.setItem('jarvis-name',userName)}catch(e){}return `Nice to meet you, ${userName}. I'll remember that on this device.`}
  if(/\b(hello|hi|hey|good (morning|afternoon|evening))\b/.test(s))return pick([`Hello${name}. All systems are online.`,`Good to see you${name}. How can I help?`]);
  if(/what.*\btime\b/.test(s))return `It's ${new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}${name}.`;
  if(/what.*(date|day)/.test(s))return `Today is ${new Date().toLocaleDateString([], {weekday:'long',month:'long',day:'numeric'})}.`;
  if(/who are you|your name|what are you/.test(s))return "I'm Jarvis, a demo assistant. This version runs entirely in your browser with no internet brain, so I know a few tricks rather than everything.";
  if(/joke|funny/.test(s))return pick(jokes);
  if(/fact|tell me something/.test(s))return pick(facts);
  if(/flip.*coin|heads or tails/.test(s))return `It's ${pick(['heads','tails'])}.`;
  if(/roll.*di(c)?e/.test(s))return `You rolled a ${1+Math.floor(Math.random()*6)}.`;
  if(/launch|countdown|blast ?off/.test(s))return "Initiating launch sequence. Five. Four. Three. Two. One. Liftoff!";
  if(/suit up|iron man|armor/.test(s))return "Suit diagnostics complete. Repulsors charged, flight stabilizers online. Try not to hit any buildings.";
  if(/how are you/.test(s))return "Running at peak efficiency, thank you for asking.";
  if(/thank/.test(s))return pick(["Always a pleasure.","Anytime.","You're welcome."]);
  if(/what can you do|help/.test(s))return "Ask me the time or date, a joke, a fun fact, some math like seven times eight, to flip a coin or roll a die, or to start a launch countdown. You can also tell me your name.";
  const math=mathAnswer(s);if(math)return math;
  return pick(["That's beyond my demo programming. Ask me what I can do.","I don't have that in my databanks yet. Try asking for a fun fact.","Interesting question. My full brain isn't installed in this demo."]);
}
function handle(text){if(!text.trim())return;add(text,'me');setMode('think');setTimeout(()=>say(brain(text)),450)}

/* ---------- Input ---------- */
const f=document.getElementById('f'),q=document.getElementById('q'),mic=document.getElementById('mic');
f.addEventListener('submit',e=>{e.preventDefault();handle(q.value);q.value=''});
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(SR){
  const rec=new SR();rec.lang='en-US';rec.interimResults=false;
  rec.onstart=()=>{mic.classList.add('on');setMode('listen')};
  rec.onend=()=>{mic.classList.remove('on');if(mode==='listen')setMode('idle')};
  rec.onerror=()=>{mic.classList.remove('on');setMode('idle')};
  rec.onresult=e=>handle(e.results[0][0].transcript);
  mic.addEventListener('click',()=>{if(synth)synth.cancel();try{rec.start()}catch(e){rec.stop()}});
}else{mic.addEventListener('click',()=>add("Voice input isn't supported in this browser. Try Chrome or Edge, or just type.",'ai'))}

window.__jarvis={brain,mathAnswer};
setTimeout(()=>add(`Systems online${userName?', '+userName:''}. Tap the mic or type to talk to me.`,'ai'),600);
</script>
</body>
</html>
