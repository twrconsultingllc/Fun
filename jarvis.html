<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="description" content="J.A.R.V.I.S. Demo: a talking assistant that runs in your browser, with a boot-up sequence, an animated orb, voice in and out, and a holo-projector that shows a 3D galaxy, the solar system and particle sculptures, which you can steer with hand gestures.">
<title>J.A.R.V.I.S. Demo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='16' fill='%23020a06'/%3E%3Ccircle cx='50' cy='50' r='30' fill='none' stroke='%2339ff88' stroke-width='6'/%3E%3Ccircle cx='50' cy='50' r='12' fill='%2339ff88'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --void:#020a06; --deep:#06170e; --phos:#39ff88; --phos-dim:#1b7a45; --label:#2fa862;
  --glass:rgba(57,255,136,.06); --amber:#ffc24a; --text:#c9ffe0;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{
  background:radial-gradient(ellipse at 50% 38%,var(--deep) 0%,var(--void) 70%);
  color:var(--text);font-family:"Chakra Petch",ui-monospace,"Segoe UI",system-ui,sans-serif;
  display:flex;flex-direction:column;overflow:hidden;
}
body::after{ /* scan lines */
  content:"";position:fixed;inset:0;pointer-events:none;z-index:40;
  background:repeating-linear-gradient(0deg,rgba(57,255,136,.035) 0 1px,transparent 1px 3px);
}
header{display:flex;justify-content:space-between;align-items:flex-start;padding:14px 18px;font-size:.8rem;color:var(--label);letter-spacing:.04em}
header b{display:block;color:var(--phos);font-size:1.4rem;font-weight:500;letter-spacing:.02em}
header a{color:var(--label);text-decoration:none}
header a:hover,header a:focus-visible{color:var(--phos)}
header a:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
#core{flex:1;display:grid;place-items:center;min-height:0;position:relative}
#orb{width:min(78vw,52vh,420px);aspect-ratio:1;display:block}
#state{position:absolute;bottom:4%;font-size:.85rem;color:var(--phos);opacity:.8;letter-spacing:.2em}
#log{height:26vh;overflow-y:auto;padding:0 18px;display:flex;flex-direction:column;gap:8px;max-width:640px;width:100%;margin:0 auto;scroll-behavior:smooth}
.msg{max-width:85%;padding:8px 12px;border:1px solid var(--phos-dim);background:var(--glass);font-size:1rem;line-height:1.4;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px))}
.me{align-self:flex-end;border-color:var(--amber);color:#ffe6b0;background:rgba(255,194,74,.06)}
.ai{align-self:flex-start}
form{display:flex;gap:10px;padding:14px 18px 18px;max-width:640px;width:100%;margin:0 auto}
input{flex:1;min-width:0;background:var(--glass);border:1px solid var(--phos-dim);color:var(--text);font:inherit;font-size:1rem;padding:12px 14px;outline:none}
input::placeholder{color:var(--label);opacity:1}
input:focus-visible{border-color:var(--phos)}
button{font:inherit;cursor:pointer;border:1px solid var(--phos);background:transparent;color:var(--phos);padding:0 16px;font-weight:700}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
#mic{width:52px;border-radius:50%;font-size:1.3rem;padding:0}
#mic.on{background:var(--phos);color:var(--void)}
#clock-box{text-align:right}
#mic-note{max-width:640px;width:100%;margin:-8px auto 0;padding:0 18px 12px;font-size:.75rem;line-height:1.35;color:var(--label)}
body.holo-on #mic-note{display:none}

/* ---------- Boot screen ---------- */
#boot{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;justify-content:flex-end;
  background:linear-gradient(to bottom,rgba(2,10,6,0) 0%,rgba(2,10,6,0) 52%,rgba(2,10,6,.94) 68%);transition:opacity .6s}
#boot[hidden],#boot-go[hidden]{display:none}
#boot.fade{opacity:0}
#boot-go{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);width:170px;height:170px;border-radius:50%;
  border:2px solid var(--phos);background:rgba(2,10,6,.6);display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:6px;letter-spacing:.2em;font-size:1rem;padding:0;animation:breathe 2.4s ease-in-out infinite}
#boot-go small{font-weight:300;letter-spacing:.04em;color:var(--label);font-size:.72rem;max-width:120px;line-height:1.3}
@keyframes breathe{50%{box-shadow:0 0 38px rgba(57,255,136,.45),inset 0 0 22px rgba(57,255,136,.25)}}
#boot-log{margin:0 auto;width:100%;max-width:640px;height:30vh;padding:0 18px 70px;font:inherit;font-size:.85rem;color:var(--label);white-space:pre-wrap;overflow:hidden}
#boot-skip{position:absolute;right:18px;bottom:max(18px,env(safe-area-inset-bottom,0px));border-color:var(--phos-dim);color:var(--label);padding:8px 14px;font-weight:500}

/* ---------- Holo-projector ---------- */
#holo{position:fixed;inset:0;z-index:10;background:radial-gradient(ellipse at 50% 45%,#031a0e 0%,#000 75%);
  clip-path:circle(0% at 50% 40%);transition:clip-path .9s cubic-bezier(.7,0,.2,1)}
#holo[hidden]{display:none}
#holo.open{clip-path:circle(150% at 50% 40%)}
#stage{position:absolute;inset:0;touch-action:none;cursor:grab}
#stage:active{cursor:grabbing}
#stage canvas{display:block;width:100%;height:100%}
.hud{position:absolute;pointer-events:none}
.corner{width:38px;height:38px;border:2px solid var(--phos);opacity:.8}
.c-tl{top:12px;left:12px;border-right:0;border-bottom:0}
.c-tr{top:12px;right:12px;border-left:0;border-bottom:0}
.c-bl{bottom:12px;left:12px;border-right:0;border-top:0}
.c-br{bottom:12px;right:12px;border-left:0;border-top:0}
/* The top HUD sits on a dark strip, so a bright star or the galaxy core behind it can't wash the text out. */
#holo-top{top:0;left:0;right:0;padding:18px 0 14px 60px;line-height:1.25;
  background:linear-gradient(to bottom,rgba(2,10,6,.9) 0,rgba(2,10,6,.9) calc(100% - 14px),rgba(2,10,6,0) 100%)}
#holo-title{margin-right:150px;font-size:.8rem;letter-spacing:.22em;color:var(--phos);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#holo-stat{margin:5px 150px 0 0;font-size:.75rem;letter-spacing:.08em;color:var(--label);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#holo-stat:empty::before{content:"\a0"}
#holo-hint{margin:5px 160px 0 0;font-size:.72rem;color:var(--label)}
#holo-hands{position:absolute;top:58px;right:56px;padding:8px 14px;background:rgba(2,10,6,.7);font-size:.8rem;letter-spacing:.1em}
#holo-hands[aria-pressed="true"]{background:var(--phos);color:var(--void)}
#hand-cam{position:absolute;top:100px;right:16px;width:160px;height:120px;border:1px solid var(--phos-dim);background:#000;display:none;pointer-events:none}
body.hands-on #hand-cam{display:block}
#reticle{width:34px;height:34px;margin:-17px 0 0 -17px;border:2px solid var(--phos);border-radius:50%;left:0;top:0;display:none;
  box-shadow:0 0 12px rgba(57,255,136,.6);transition:width .12s,height .12s,margin .12s,background .12s}
#reticle.on{display:block}
#reticle.pinch{width:18px;height:18px;margin:-9px 0 0 -9px;border-color:var(--amber);background:rgba(255,194,74,.35)}
@media (max-width:600px){
  #holo-top{padding-left:24px}#holo-title{margin-right:196px;letter-spacing:.12em}#holo-stat{margin-right:196px}
  #holo #holo-close{top:14px;right:16px;padding:7px 10px}#holo #holo-hands{top:14px;right:102px;padding:7px 10px}
  #hand-cam{top:58px;width:120px;height:90px}#holo-hint{margin:9px 148px 0 0;font-size:.68rem}
}
#holo-close{position:absolute;top:16px;right:56px;padding:8px 14px;background:rgba(2,10,6,.7);font-size:.8rem;letter-spacing:.1em}
#holo-cap{left:50%;transform:translateX(-50%);bottom:96px;width:max-content;max-width:min(640px,calc(100vw - 32px));text-align:center;
  padding:10px 14px;border:1px solid var(--phos-dim);background:rgba(2,10,6,.75);font-size:.95rem;line-height:1.4}
#holo-cap:empty{display:none}
.scan{left:0;right:0;top:0;height:2px;background:var(--phos);box-shadow:0 0 18px var(--phos);opacity:0}
#holo.open .scan{animation:scan 1.1s ease-out .25s 1}
@keyframes scan{0%{top:0;opacity:1}100%{top:100%;opacity:0}}
body.holo-on #log{display:none}
body.holo-on form{position:fixed;left:0;right:0;bottom:0;z-index:20;background:linear-gradient(to top,rgba(2,10,6,.92),rgba(2,10,6,0));
  padding-bottom:max(18px,env(safe-area-inset-bottom,0px))}

@media (prefers-reduced-motion:reduce){
  #log{scroll-behavior:auto}
  #boot-go{animation:none}
  #holo{transition:none}
  #holo.open .scan{animation:none}
}
</style>
</head>
<body>
<header>
  <div><b>J.A.R.V.I.S.</b>Demo build · no internet brain · <a href="index.html">← Fun</a></div>
  <div id="clock-box"><b id="clock">--:--</b><span id="date"></span></div>
</header>

<div id="core"><canvas id="orb" width="840" height="840"></canvas><div id="state">STANDBY</div></div>

<div id="log" aria-live="polite"></div>

<form id="f">
  <button type="button" id="mic" aria-label="Talk to Jarvis">🎙</button>
  <input id="q" placeholder="Ask me something…" autocomplete="off" aria-label="Message">
  <button type="submit">Send</button>
</form>
<p id="mic-note" hidden>🎙 The mic uses your browser's online speech service. Typing stays on this device.</p>

<div id="holo" role="region" aria-label="Holo-projector" hidden>
  <div id="stage"></div>
  <div class="hud" id="holo-top">
    <div id="holo-title"></div>
    <div id="holo-stat"></div>
    <div id="holo-hint"></div>
  </div>
  <div class="scan hud"></div>
  <div class="hud corner c-tl"></div><div class="hud corner c-tr"></div>
  <div class="hud corner c-bl"></div><div class="hud corner c-br"></div>
  <div class="hud" id="holo-cap" aria-live="polite"></div>
  <button type="button" id="holo-close" aria-label="Close the holo-projector">✕ CLOSE</button>
  <button type="button" id="holo-hands" aria-pressed="false" aria-label="Hand control">✋ HANDS</button>
  <canvas id="hand-cam" width="160" height="120" aria-hidden="true"></canvas>
  <div class="hud" id="reticle"></div>
</div>

<div id="boot">
  <button type="button" id="boot-go">INITIALIZE<small>Tap to power up J.A.R.V.I.S.</small></button>
  <pre id="boot-log" aria-live="polite"></pre>
  <button type="button" id="boot-skip">Skip ›</button>
</div>

<script>
/* ---------- Clock ---------- */
const clock=document.getElementById('clock'),dateEl=document.getElementById('date');
function tick(){const d=new Date();clock.textContent=d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});dateEl.textContent=d.toLocaleDateString([], {weekday:'long',month:'short',day:'numeric'})}
tick();setInterval(tick,1000);

/* ---------- Orb ---------- */
const cv=document.getElementById('orb'),cx=cv.getContext('2d'),stateEl=document.getElementById('state');
let mode='idle',energy=0,bootP=0; // bootP: how much of the orb has assembled, 0..1
const reduce=!!window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
const amb=reduce?.15:1; // ambient motion: slow everything right down when reduced motion is asked for
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function setMode(m){mode=m;stateEl.textContent={idle:'STANDBY',listen:'LISTENING',think:'PROCESSING',speak:'SPEAKING'}[m]}
// How hard the orb pulses this frame. hearing: speech recognition says it can hear someone talking.
// sinceWord: seconds since Jarvis started the last spoken word, or null when the voice doesn't report words.
function orbPulse({mode,energy,t,hearing=false,sinceWord=null,still=false}){
  if(still)return energy*.6; // reduced motion: hold steady
  if(mode==='listen'&&hearing)return energy*(.7+.3*Math.sin(t/70));
  if(mode==='speak'&&sinceWord!==null)return energy*(.45+.55*Math.exp(-sinceWord*7));
  return energy*(.6+.4*Math.sin(t/(mode==='speak'?90:400)));
}
let lastWord=null; // when the current utterance last started a word (rAF time), or null
// Set by recognition's own speechstart/speechend events. The orb never opens a mic stream of its own:
// a second stream took the mic away from speech recognition on a phone (2026-10-09).
let hearing=false;
function draw(t){
  requestAnimationFrame(draw);
  if(document.body.classList.contains('holo-on'))return; // hidden behind the hologram
  const W=cv.width,c=W/2,bp=bootP;cx.clearRect(0,0,W,W);
  const heard=mode==='listen'&&hearing;
  const target=heard?.95:{idle:.15,listen:.45,think:.45,speak:.9}[mode];
  energy+=(target-energy)*(heard?.25:.06); // jump up as soon as it hears you
  const pulse=orbPulse({mode,energy,t,hearing:heard,still:reduce,sinceWord:mode==='speak'&&lastWord!==null?Math.max(0,(t-lastWord)/1000):null});
  // glow core
  const gr=W*.22*(.25+.75*bp),g=cx.createRadialGradient(c,c,0,c,c,gr);
  g.addColorStop(0,`rgba(180,255,210,${(.55+pulse*.4)*(.3+.7*bp)})`);g.addColorStop(.35,`rgba(57,255,136,${(.25+pulse*.3)*bp})`);g.addColorStop(1,'rgba(57,255,136,0)');
  cx.fillStyle=g;cx.beginPath();cx.arc(c,c,gr,0,7);cx.fill();
  // rings, which lock into place one by one while booting
  const rings=[[.16,6,1.2,.9],[.24,3,-.7,.6],[.31,12,.4,.5],[.38,2,-.25,.35],[.45,40,.1,.25]];
  rings.forEach(([r,segs,spd,a],i)=>{
    const k=clamp(bp*1.8-i*.18,0,1),shown=Math.round(segs*k);if(!shown)return;
    const R=W*r*(reduce?1:1+pulse*.04*(i%2?1:-1)),rot=(reduce?0:t/1000*spd*(1+energy*2))+(1-k)*4*(i%2?-1:1);
    cx.strokeStyle=`rgba(57,255,136,${(a+pulse*.3)*k})`;cx.lineWidth=i===4?2:i===0?10:4;
    const gap=segs>20?.06:.25;
    for(let s=0;s<shown;s++){const a0=rot+s*Math.PI*2/segs;cx.beginPath();cx.arc(c,c,R,a0,a0+Math.PI*2/segs-gap);cx.stroke()}
  });
  // tick marks
  cx.strokeStyle=`rgba(57,255,136,${.08+.32*clamp(bp*1.3,0,1)})`;cx.lineWidth=2;
  for(let i=0;i<72;i++){const a=i*Math.PI/36,r1=W*.48,r2=W*(i%6?.47:.455);cx.beginPath();cx.moveTo(c+Math.cos(a)*r1,c+Math.sin(a)*r1);cx.lineTo(c+Math.cos(a)*r2,c+Math.sin(a)*r2);cx.stroke()}
}
if(cx)requestAnimationFrame(draw); // no 2D canvas (e.g. jsdom): skip the orb, the chat still works

/* ---------- Sound effects (quiet, only after a tap) ---------- */
let ac=null;
function blip(freq=880,dur=.05,vol=.03,type='square',delay=0){
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    const t0=ac.currentTime+delay,o=ac.createOscillator(),g=ac.createGain();
    o.type=type;o.frequency.setValueAtTime(freq,t0);g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
    o.connect(g).connect(ac.destination);o.start(t0);o.stop(t0+dur+.02);
  }catch(e){}
}

/* ---------- Voice out ---------- */
const synth=window.speechSynthesis||null;
let voice=null;
function pickVoice(){const v=synth.getVoices();voice=v.find(x=>/en-GB/i.test(x.lang)&&/male|daniel|arthur|george/i.test(x.name))||v.find(x=>/en-GB/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang))||null}
if(synth){pickVoice();synth.onvoiceschanged=pickVoice}
// Chrome stops speaking a long utterance after about 15 seconds, so long answers go out a sentence or two
// at a time: every sentence whole, each piece at most about 160 characters unless one sentence is longer.
function speechChunks(text,max=160){
  const out=[];
  for(const sen of String(text).match(/[^.!?]+(?:[.!?]+|$)/g)||[]){const t=sen.trim();if(!t)continue;
    const n=out.length;if(n&&out[n-1].length+1+t.length<=max)out[n-1]+=' '+t;else out.push(t)}
  return out;
}
let sayGen=0; // which answer is being spoken, so a cancelled one can't switch the orb back to idle
function say(text){
  add(text,'ai');
  if(!synth){setMode('idle');return}
  const gen=++sayGen,parts=speechChunks(text);
  synth.cancel();
  parts.forEach((p,i)=>{
    const u=new SpeechSynthesisUtterance(p);if(voice)u.voice=voice;u.rate=1.02;u.pitch=.9;
    u.onstart=()=>{if(gen!==sayGen)return;lastWord=null;setMode('speak')};
    u.onend=u.onerror=()=>{if(gen!==sayGen||i<parts.length-1)return;lastWord=null;setMode('idle')};
    // There's no audio tap on speech synthesis, so pulse on each word where the voice reports them.
    u.onboundary=e=>{if(!e.name||e.name==='word')lastWord=performance.now()};
    synth.speak(u);
  });
  // Some browsers never start speaking (no voices installed); don't stay stuck on PROCESSING.
  setTimeout(()=>{if(mode==='think')setMode('idle')},1500);
}

/* ---------- Chat log ---------- */
const log=document.getElementById('log'),holoCap=document.getElementById('holo-cap');
function add(text,who){
  const d=document.createElement('div');d.className='msg '+who;d.textContent=text;log.appendChild(d);log.scrollTop=log.scrollHeight;
  if(who==='ai')holoCap.textContent=text;
}

/* ---------- Built-in brain (no internet, kid-safe) ---------- */
let userName=null;try{userName=localStorage.getItem('jarvis-name')}catch(e){}
const pick=a=>a[Math.floor(Math.random()*a.length)];
const jokes=["Why did the robot go on vacation? It needed to recharge its batteries.","What do you call a computer that sings? A Dell.","Why was the math book sad? It had too many problems.","How does the moon cut its hair? Eclipse it.","Why don't skeletons fight each other? They don't have the guts."];
const facts=["Octopuses have three hearts.","A day on Venus is longer than a year on Venus.","Honey never spoils. Archaeologists have found edible honey in ancient Egyptian tombs.","Sharks existed before trees did.","The Eiffel Tower grows about 15 centimeters taller in summer because the metal expands."];
const nums={zero:0,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12};
// "I'm happy" / "I am fine" are not names.
const notNames=new Set(['fine','good','great','ok','okay','happy','sad','tired','bored','hungry','sorry','here','back','ready','not','so','very','just','doing','going','feeling','a','an','the','still','well','sick','cold','hot','excited','done','sure','in','on','at','from','with','your','listening','scared','mad','angry','sleepy','thirsty','awesome','cool','alright','busy','lost','confused','home','learning','trying','playing','looking','talking']);
function mathAnswer(s){
  s=s.replace(/\b(zero|one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve)\b/g,m=>nums[m])
     .replace(/\b(times|multiplied by|x)\b/g,'*').replace(/\b(plus|add)\b/g,'+').replace(/\b(minus|take away)\b/g,'-').replace(/\b(divided by|over)\b/g,'/');
  const m=s.match(/(-?\d+(?:\.\d+)?)\s*([+\-*/])\s*(-?\d+(?:\.\d+)?)/);if(!m)return null;
  const a=+m[1],b=+m[3],r={'+':a+b,'-':a-b,'*':a*b,'/':b===0?null:a/b}[m[2]];
  return r===null?"Dividing by zero would tear a hole in the universe. Let's not.":`That would be ${+r.toFixed(4)}.`;
}
function brain(raw){
  const s=raw.toLowerCase().trim(),name=userName?`, ${userName}`:'';
  let m;
  if((m=s.match(/\b(?:my name is|call me|i am|i'm) ([a-z]+)/))&&!notNames.has(m[1])){userName=m[1][0].toUpperCase()+m[1].slice(1);try{localStorage.setItem('jarvis-name',userName)}catch(e){}return `Nice to meet you, ${userName}. I'll remember that on this device.`}
  if(/\bhelp\b|what (?:else )?(?:can|do) you (?:do|know)|what you can do|what can you show|what (?:can|should) i (?:say|ask)|\b(?:your|the) (?:commands|features|skills|abilities)\b|\blist (?:of )?(?:commands|features)/.test(s))return "Ask me the time or date, a joke, a fun fact, or some math like seven times eight. I can flip a coin, roll a die or start a launch countdown. For the holo-projector, say show me the galaxy, show me the planets, take me to Mars, make a heart, make a rocket, or write your name. Say hand control to steer it with your hands through the camera. Say close to turn it off, or reboot to watch me power up again.";
  if(/\b(hello|hi|hey|good (morning|afternoon|evening))\b/.test(s))return pick([`Hello${name}. All systems are online.`,`Good to see you${name}. How can I help?`]);
  if(/what.*\btime\b/.test(s))return `It's ${new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}${name}.`;
  if(/what.*(date|day)/.test(s))return `Today is ${new Date().toLocaleDateString([], {weekday:'long',month:'long',day:'numeric'})}.`;
  if(/who are you|your name|what are you/.test(s))return "I'm Jarvis, a demo assistant. This version runs entirely in your browser with no internet brain, so I know a few tricks rather than everything.";
  if(/joke|funny/.test(s))return pick(jokes);
  if(/fact|tell me something/.test(s))return pick(facts);

  if(/how are you/.test(s))return "Running at peak efficiency, thank you for asking.";
  if(/thank/.test(s))return pick(["Always a pleasure.","Anytime.","You're welcome."]);

const SHAPE_WORDS={heart:'heart',love:'heart',rocket:'rocket',spaceship:'rocket',ship:'rocket',star:'star',sphere:'sphere',ball:'sphere',globe:'sphere',orb:'sphere',dna:'dna',helix:'dna','double helix':'dna','arc reactor':'reactor',reactor:'reactor'};
function cleanWord(w){return String(w||'').toUpperCase().replace(/[^A-Z0-9 !?'&-]/g,'').replace(/\s+/g,' ').trim().slice(0,14)}
function intent(raw){
  const s=raw.toLowerCase().replace(/[.!,]+/g,' ').replace(/\s+/g,' ').trim();let m;
  if(/\b(stop|end|disable|turn off|no more)\b.*\b(hand|hands|gesture|gestures)\b|\b(hand|gesture) (control|tracking|mode) off\b/.test(s))return {kind:'hands',arg:false};
  if(/\b(hand|hands|gesture|gestures) (control|tracking|mode)\b|\buse my hands?\b|\b(enable|start|turn on)( the)? (hand|gesture)/.test(s))return {kind:'hands',arg:true};
  if(/^(close|exit|stop|dismiss|hide|go back|back)( (it|that|this|the (hologram|projector|scene)))?$/.test(s)||/\b(close|turn off|shut down) the (hologram|projector|holo-projector)\b/.test(s))return {kind:'close'};
  if(/\b(reboot|restart|boot (up|sequence)|power (up|cycle))\b/.test(s))return {kind:'boot'};
  if(m=s.match(new RegExp(`\\b(?:take me to|go to|fly to|show me|zoom (?:in )?(?:on|to)|visit|focus on)(?: the)? (${PLANETS})\\b`)))return {kind:'solar',arg:m[1]};
  if(/\b(solar system|planets)\b/.test(s))return {kind:'solar',arg:null};
  if(/\b(galaxy|galaxies|milky way|star clusters?|nebula|universe|deep space|the stars)\b/.test(s))return {kind:'galaxy'};
  if(/\b(fly|zoom|take us|go) (in|into|through|closer)\b/.test(s))return {kind:'zoom',arg:'in'};
  if(/\b(zoom|fly|pull|go) (out|back out|away)\b/.test(s))return {kind:'zoom',arg:'out'};
  if(m=s.match(/\b(?:write|spell)(?: out)? (.+)$/)){
    const w=/^(my name|me)$/.test(m[1])?(userName||'YOU'):/^(your name|yourself)$/.test(m[1])?'JARVIS':m[1];
    const word=cleanWord(w);return word?{kind:'particles',arg:{text:word}}:null;
  }
  if(m=s.match(/\b(?:make|build|create|form|construct|draw|show me)(?: me)?(?: (an?|the|some))? ([a-z][a-z ]*)$/)){
    const w=m[2].replace(/\b(for (me|us)|please|now|right now)\b/g,'').replace(/\s+/g,' ').trim(),two=w.split(' ').slice(0,2).join(' ');
    const shape=SHAPE_WORDS[w]||SHAPE_WORDS[two]||SHAPE_WORDS[w.split(' ')[0]];
    if(shape)return {kind:'particles',arg:{shape}};
    if(!w)return null;
    // Anything else gets spelled out, but only for "make a dog", not "make me laugh".
    if(m[1]&&/^(make|build|create|construct)\b/.test(s.slice(m.index))){const word=cleanWord(w);if(word)return {kind:'particles',arg:{text:word,unknown:w}}}
  }
  return null;
}

    for(let i=0;i<N;i++){let x,y;do{x=(R()*2-1)*13;y=(R()*2-1)*13}while(!inside(x,y));const d=Math.hypot(x,y)/13;o.put(i,x,y,(R()*2-1)*4*(1-d),mix(b,a,d))}

/* Scene 1: a spiral galaxy with globular clusters */
function buildGalaxy(T){

  const N=small?50000:110000,arms=4,RAD=60,bulge=Math.floor(N*.18);

  for(let i=0;i<N;i++){

  core.scale.set(34,34,1);group.add(core);

    hint:'Drag to rotate · scroll or pinch to zoom · say "fly in" or "zoom out"',

/* Scene 3: particles that morph into whatever you ask for */
function buildParticles(T){
  const scene=new T.Scene(),camera=makeCamera(T),N=innerWidth<700?7000:14000;
  const start=SHAPES.sphere(N),pos=new Float32Array(N*3),col=new Float32Array(N*3),speed=new Float32Array(N);
  for(let i=0;i<N*3;i++){pos[i]=start.pos[i]*4+(R()-.5)*30;col[i]=start.col[i]*.3}
  for(let i=0;i<N;i++)speed[i]=.4+R();
  const g=new T.BufferGeometry(),pa=new T.BufferAttribute(pos,3),ca=new T.BufferAttribute(col,3);g.setAttribute('position',pa);g.setAttribute('color',ca);
  const group=new T.Group();
  group.add(new T.Points(g,new T.PointsMaterial({size:.45,map:dotTexture(T),vertexColors:true,transparent:true,depthWrite:false,blending:T.AdditiveBlending})));
  scene.add(group,starfield(T,2000));
  const rig=makeRig(T,camera,{dist:120,goal:48,el:.5,elGoal:.12,min:10,max:160,spin:0});
  let tgt=start.pos,tcol=start.col,flame=null,upright=false,squeezed=false,current='sphere';
  const SEQ=['heart','rocket','star','dna','reactor','sphere'];
  function setArg(a){
    a=a||{shape:'sphere'};current=a.shape||null;
    const o=a.text?textPoints(N,a.text):shapePoints(a.shape,N),fallback=!o;
    const shape=o||SHAPES.sphere(N);
    tgt=shape.pos;tcol=shape.col;flame=shape.flame||null;upright=!!a.text&&!fallback;
    rig.goal=Math.max(48,upright?fitDist(24,7):fitDist(14,16));
    for(let i=0;i<N*3;i++)pos[i]+=(R()-.5)*6; // a little burst before they regroup
    setStat(`${N.toLocaleString()} PARTICLES · ${(a.text||a.shape||'sphere').toUpperCase()}`);
    if(a.text&&fallback)return "I couldn't render text on this device, so here's a sphere instead.";
    if(a.unknown)return `I don't have a blueprint for ${/^[aeiou]/.test(a.unknown)?'an':'a'} ${a.unknown}, so here it is in lights.`;
    if(a.text)return `Writing ${a.text} in lights.`;
    return SHAPE_LINES[a.shape]||SHAPE_LINES.sphere;
  }
  return {scene,camera,rig,title:'PARTICLE SCULPTOR',stat:'',hint:'Drag to rotate · say "make a rocket", "make a heart", "make an arc reactor" or "write" any word',setArg,
    next(dir){const i=SEQ.indexOf(current);return setArg({shape:SEQ[(i+dir+SEQ.length)%SEQ.length]})},
    squeeze(on){if(on===squeezed)return;squeezed=on;if(!on)for(let i=0;i<N*3;i++)pos[i]*=1+R()*.6;blip(on?180:520,.15,.03,'sawtooth')},
    update(dt,t){
      const s=squeezed?.07:1; // a fist crushes the sculpture into a tight ball
      for(let i=0;i<N;i++){const e=1-Math.pow(.05,dt*speed[i]*(squeezed?2:1)),j=i*3;
        pos[j]+=(tgt[j]*s-pos[j])*e;pos[j+1]+=(tgt[j+1]*s-pos[j+1])*e;pos[j+2]+=(tgt[j+2]*s-pos[j+2])*e;
        col[j]+=(tcol[j]-col[j])*e;col[j+1]+=(tcol[j+1]-col[j+1])*e;col[j+2]+=(tcol[j+2]-col[j+2])*e}
      if(flame&&amb===1)for(let i=flame[0];i<flame[1];i++){const j=i*3;pos[j]+=(R()-.5)*.35;pos[j+1]+=(R()-.5)*.6;pos[j+2]+=(R()-.5)*.35}
      pa.needsUpdate=true;ca.needsUpdate=true;
      // shapes turn slowly; words sway so they stay readable
      let ry=group.rotation.y;if(upright){ry=Math.atan2(Math.sin(ry),Math.cos(ry));group.rotation.y=ry+(Math.sin(t*.5)*.3*amb-ry)*Math.min(1,dt*2)}

    }};
}

const HANDS_HINT='✋ Pinch and drag to turn · pinch with both hands and pull apart to zoom · quick pinch to select · swipe an open hand to change · make a fist to crush particles';
// Is this landmark set (21 points, x already mirrored, 0..1) a pinch, an open hand, a fist?
function classifyHand(lm){
  const d=(a,b)=>Math.hypot(lm[a].x-lm[b].x,lm[a].y-lm[b].y),size=d(0,9)||1e-6;
  const ext=[[8,6],[12,10],[16,14],[20,18]].filter(([t,p])=>d(0,t)>d(0,p)*1.15).length;
  const indexOut=d(0,8)>d(0,5)*1.25; // a pinching index finger reaches past its knuckle; a fist's doesn't
  return {size,ext,indexOut,pinchR:d(4,8)/size,fist:ext===0&&!indexOut,
    cursor:{x:(lm[4].x+lm[8].x)/2,y:(lm[4].y+lm[8].y)/2},palm:{x:(lm[0].x+lm[9].x)/2,y:(lm[0].y+lm[9].y)/2}};

// Turns frames of hands into actions: rotate, zoom, tap, swipe, squeeze, grab, cursor.

      const c=classifyHand(lm);let h=st.hands[key];

      h.cur.x+=(c.cursor.x-h.cur.x)*.5;h.cur.y+=(c.cursor.y-h.cur.y)*.5;h.c=c;
      const was=h.pinch;h.pinch=c.indexOut&&(was?c.pinchR<.42:c.pinchR<.26);
      if(h.pinch&&!was){h.down={t,travel:0};h.last={...h.cur}}

    let key=(res.handedness&&res.handedness[i]&&res.handedness[i][0]&&res.handedness[i][0].categoryName)||'hand';
    if(keys.has(key))key+=i;keys.add(key);
    return {key,lm:lm.map(p=>({x:1-p.x,y:p.y,z:p.z}))};
  });
  const actions=HC.step(list,now/1000);
  const grab=actions.find(a=>a.type==='grab'),pinchNow=!!(grab&&grab.on);
  drawHands(list.map((h,i)=>({lm:h.lm,pinch:pinchNow&&i===0})));
  for(const a of actions)applyGesture(a);
}
handsBtn.addEventListener('click',async()=>{const r=HC?(stopHands(),"Hand control off. The camera is off too."):await startHands();if(r)say(r)});

/* ---------- Boot sequence ---------- */
const boot=document.getElementById('boot'),bootGo=document.getElementById('boot-go'),bootLog=document.getElementById('boot-log');
let booting=false,bootTimers=[];
function placeBootButton(){const r=cv.getBoundingClientRect();if(r.height)bootGo.style.top=(r.top+r.height/2)+'px'}
function greeting(){
  const h=new Date().getHours(),part=h<12?'morning':h<18?'afternoon':'evening';
  return `Good ${part}${userName?', '+userName:''}. All systems online. Tap the mic or type to talk to me.`;
}
function showBoot(){
  bootTimers.forEach(clearTimeout);bootTimers=[];booting=false;bootP=0;
  boot.classList.remove('fade');boot.hidden=false;bootGo.hidden=false;bootLog.textContent='';placeBootButton();bootGo.focus();
}
function runBoot(){
  if(booting)return;booting=true;bootGo.hidden=true;setMode('think');
  const lines=["J.A.R.V.I.S. kernel 4.2 ............ loaded","Arc reactor output ................ 3.2 GW",
    "Neural lattice .................... synced","Holo-projector .................... "+(hasWebGL()?'ready':'no WebGL'),
    "Voice synthesis ................... "+(synth?'online':'unavailable'),"Speech recognition ................ "+(SR?'online':'unavailable'),
    "Hand tracking ..................... "+(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia?'camera ready':'no camera'),
    "Security protocols ................ armed","Wit module ........................ calibrated"];
  const dur=reduce?600:3200,t0=performance.now();
  lines.forEach((l,i)=>bootTimers.push(setTimeout(()=>{bootLog.textContent+=l+'\n';blip(660+i*90,.05,.025)},i*dur/lines.length)));
  bootTimers.push(setTimeout(finishBoot,dur+350));
  (function grow(){if(!booting)return;bootP=Math.min(1,(performance.now()-t0)/dur);if(bootP<1)requestAnimationFrame(grow)})();
}
function finishBoot(){
  if(boot.hidden)return;
  bootTimers.forEach(clearTimeout);bootTimers=[];booting=false;bootP=1;
  boot.classList.add('fade');bootTimers.push(setTimeout(()=>{boot.hidden=true},reduce?0:600));
  blip(440,.18,.03,'sine');blip(880,.3,.03,'sine',.1);
  say(greeting());q.focus();
}
bootGo.addEventListener('click',runBoot);
document.getElementById('boot-skip').addEventListener('click',finishBoot);
addEventListener('resize',placeBootButton);
addEventListener('keydown',e=>{
  if(e.key!=='Escape')return;
  if(!boot.hidden)finishBoot();else if(closeHolo())say("Projector off.");
});

function handle(text){
  if(!text.trim())return;add(text,'me');setMode('think');
  const it=intent(text);
  setTimeout(async()=>{const r=it?await project(it):brain(text);if(r)say(r);else if(mode==='think'&&!booting)setMode('idle')},450);
}

/* ---------- Input ---------- */
const f=document.getElementById('f'),q=document.getElementById('q'),mic=document.getElementById('mic');
f.addEventListener('submit',e=>{e.preventDefault();handle(q.value);q.value=''});
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const micNote=document.getElementById('mic-note');
if(SR){
  // Shown until the mic has been used once on this device.
  let noted=false;try{noted=!!localStorage.getItem('jarvis-mic-note')}catch(e){}
  if(!noted)micNote.hidden=false;
  const rec=new SR();rec.lang='en-US';rec.interimResults=false;
  rec.onstart=()=>{hearing=false;mic.classList.add('on');setMode('listen');try{localStorage.setItem('jarvis-mic-note','1')}catch(e){}};
  // The orb reacts to your voice through recognition's own events, so it never competes for the mic.
  rec.onspeechstart=()=>{hearing=true};rec.onspeechend=()=>{hearing=false};
  rec.onend=()=>{hearing=false;mic.classList.remove('on');if(mode==='listen')setMode('idle')};
  rec.onerror=()=>{hearing=false;mic.classList.remove('on');setMode('idle')};
  rec.onresult=e=>handle(e.results[0][0].transcript);
  mic.addEventListener('click',()=>{if(synth)synth.cancel();try{rec.start()}catch(e){rec.stop()}});
}else{mic.addEventListener('click',()=>add("Voice input isn't supported in this browser. Try Chrome or Edge, or just type.",'ai'))}

window.__jarvis={speechChunks,brain,mathAnswer,intent,shapePoints,project,finishBoot,classifyHand,createGestures,orbPulse,energy:()=>energy,hearing:()=>hearing};
showBoot();
</script>
