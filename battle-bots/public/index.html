<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLM Battle Bots</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="ui">
        <div id="status">Select a model and click Start Battle</div>
        <div id="controls">
            <select id="model-select">
                <option value="">Loading available models...</option>
            </select>
            <button id="start-btn">START BATTLE</button>
        </div>
    </div>
    
    <div id="log-window">
        <div id="log-header">Live API Logs (Last 20)</div>
        <div id="log-content"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="game.js"></script>
</body>
</html>
