<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D AI Battle Arena</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="canvas-container"></div>

    <!-- HUD Overlay styled like bots.html -->
    <div id="hud">
        <div class="hud-panel title-panel">
            <h1>AI ARENA BATTLE BOTS</h1>
            <div id="status">INITIALIZING SYSTEMS...</div>
        </div>

        <div class="hud-panel config-panel">
            <div class="bot-config red-theme">
                <h3>RED BOT A STRATEGY</h3>
                <input type="text" id="prompt-a" value="Circle strafe around target, maintain medium distance, aggressive laser bursts.">
            </div>

            <div class="bot-config blue-theme">
                <h3>BLUE BOT B STRATEGY</h3>
                <input type="text" id="prompt-b" value="Kite backwards, snipe from corners, use defensive shield when health is low.">
            </div>

            <div class="control-row">
                <select id="model-select">
                    <option value="">LOADING AI MODELS...</option>
                </select>
                <button id="start-btn">ENGAGE BATTLE</button>
            </div>
        </div>
    </div>

    <!-- Live Telemetry Stream -->
    <div id="log-window">
        <div id="log-header">LIVE TELEMETRY LOGS</div>
        <div id="log-content"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="game.js"></script>
</body>
</html>
