<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Unlocked</title>
    
    <!-- Load Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;900&display=swap" rel="stylesheet">
    
    <!-- Load Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Inter', sans-serif;
        }

        #mercury-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        .overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            text-align: center;
            pointer-events: none;
            width: 100%;
            padding: 0 20px;
        }

        h1 {
            color: #ffffff;
            font-weight: 900;
            font-size: clamp(2rem, 5vw, 4rem);
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.8), 0 0 40px rgba(0, 255, 255, 0.5);
            letter-spacing: 2px;
            animation: pulseText 3s infinite alternate;
        }

        @keyframes pulseText {
            0% { transform: scale(1); text-shadow: 0 0 20px rgba(255, 255, 255, 0.5); }
            100% { transform: scale(1.02); text-shadow: 0 0 30px rgba(255, 255, 255, 1), 0 0 60px rgba(0, 255, 255, 0.8); }
        }
    </style>
</head>
<body>

    <div class="overlay">
        <h1>Congratulations,<br>you figured out the code</h1>
    </div>

    <canvas id="mercury-canvas"></canvas>

    <script>
        const canvas = document.getElementById('mercury-canvas');
        const scene = new THREE.Scene();
        
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 5;

        const renderer = new THREE.WebGLRenderer({
            canvas: canvas,
            antialias: true
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        // Create lighting to make it look like shiny metal
        const ambientLight = new THREE.AmbientLight(0x404040, 2); 
        scene.add(ambientLight);

        const pointLight1 = new THREE.PointLight(0xffffff, 3, 100);
        pointLight1.position.set(5, 5, 5);
        scene.add(pointLight1);

        const pointLight2 = new THREE.PointLight(0x00ffff, 2, 100);
        pointLight2.position.set(-5, -5, 5);
        scene.add(pointLight2);

        const pointLight3 = new THREE.PointLight(0xff00ff, 2, 100);
        pointLight3.position.set(0, 5, -5);
        scene.add(pointLight3);

        // High poly sphere for smooth vertex manipulation
        const geometry = new THREE.SphereGeometry(1.8, 128, 128);
        
        // Store original positions for deformation calculations
        const basePositions = geometry.attributes.position.clone();
        geometry.userData.basePositions = basePositions;

        // Mercury Material
        const material = new THREE.MeshStandardMaterial({
            color: 0xcccccc,
            roughness: 0.05, 
            metalness: 1.0, 
            envMapIntensity: 2.0
        });

        const blob = new THREE.Mesh(geometry, material);
        scene.add(blob);

        const clock = new THREE.Clock();
        const vertex = new THREE.Vector3();

        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();

            // Rotate the blob slightly
            blob.rotation.x = time * 0.1;
            blob.rotation.y = time * 0.2;

            // Liquid Vertex Deformation
            const positions = geometry.attributes.position;
            const bases = geometry.userData.basePositions;

            for (let i = 0; i < positions.count; i++) {
                vertex.fromBufferAttribute(bases, i);
                
                // Mathematical noise for undulating liquid effect
                const wave1 = Math.sin(vertex.x * 2 + time * 1.5);
                const wave2 = Math.cos(vertex.y * 3 + time * 2.0);
                const wave3 = Math.sin(vertex.z * 2 + time * 1.0);
                
                // Scale vertices out based on the noise
                const displacement = (wave1 * wave2 * wave3) * 0.15;
                vertex.multiplyScalar(1 + displacement);
                
                positions.setXYZ(i, vertex.x, vertex.y, vertex.z);
            }
            
            positions.needsUpdate = true;
            geometry.computeVertexNormals(); // Recompute light reflections

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
