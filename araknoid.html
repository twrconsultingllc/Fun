<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Arkanoid Mobile</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0a0a1a;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            touch-action: none; /* Prevents pull-to-refresh and swiping on mobile */
            -webkit-user-select: none;
            user-select: none;
        }

        #game-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
        }

        #game-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
        }

        canvas {
            background-color: #000;
            border: 2px solid #4a00e0;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(74, 0, 224, 0.4);
            max-width: 100%;
            max-height: 100%;
        }

        #controls-container {
            width: 100%;
            padding-bottom: max(40px, env(safe-area-inset-bottom, 40px));
            background: linear-gradient(to top, #111, #1a1a2e);
            border-top: 2px solid #333;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        .hud {
            display: flex;
            justify-content: space-between;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: bold;
            color: #0ff;
            text-shadow: 0 0 5px #0ff;
        }

        .button-row {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            gap: 8px;
        }

        .btn {
            background-color: #222;
            color: white;
            border: 2px solid #555;
            border-radius: 12px;
            padding: 20px 0;
            font-size: 16px;
            font-weight: bold;
            flex: 1;
            text-align: center;
            touch-action: none;
            box-shadow: 0 4px 0 #111;
            transition: transform 0.05s, box-shadow 0.05s;
        }

        .btn:active, .btn.active {
            transform: translateY(4px);
            box-shadow: 0 0px 0 #111;
            background-color: #444;
        }

        .btn-move {
            border-color: #4a00e0;
            color: #8e2de2;
        }
        
        .btn-launch {
            border-color: #00e676;
            color: #00e676;
        }

        .btn-special {
            border-color: #ff3d00;
            color: #ff3d00;
        }

        .btn-special.cooldown {
            opacity: 0.5;
            filter: grayscale(100%);
            pointer-events: none;
        }

        #screen-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.8);
            z-index: 10;
            pointer-events: none;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="game-wrapper">
    <div id="game-container" style="position: relative;">
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <div id="screen-overlay">
            <h1 id="overlay-title" style="color: #0ff; text-shadow: 0 0 10px #0ff; margin-bottom: 10px;">ARKANOID</h1>
            <p id="overlay-text" style="color: #ccc; font-size: 12px; text-align: center; padding: 0 20px;">Tap LAUNCH to start.<br>Break all bricks.</p>
        </div>
    </div>

    <div id="controls-container">
        <div class="hud">
            <span id="scoreDisplay">SCORE: 0</span>
            <span id="livesDisplay">LIVES: 3</span>
            <span id="specialCooldown" style="color: #ff3d00;">FIREBALL: READY</span>
        </div>
        <div class="button-row">
            <button class="btn btn-move" id="btn-left">◀</button>
            <button class="btn btn-move" id="btn-right">▶</button>
            <button class="btn btn-launch" id="btn-launch">LAUNCH</button>
            <button class="btn btn-special" id="btn-special">FIREBALL</button>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    // UI Elements
    const scoreDisplay = document.getElementById('scoreDisplay');
    const livesDisplay = document.getElementById('livesDisplay');
    const specialCooldownDisplay = document.getElementById('specialCooldown');
    const overlay = document.getElementById('screen-overlay');
    const overlayTitle = document.getElementById('overlay-title');
    const overlayText = document.getElementById('overlay-text');
    const btnSpecial = document.getElementById('btn-special');

    // Make canvas always square based on container
    function resizeCanvas() {
        const container = document.getElementById('game-container');
        const size = Math.min(container.clientWidth, container.clientHeight) - 20; // 20px for padding
        canvas.style.width = size + 'px';
        canvas.style.height = size + 'px';
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Internal Game Resolution
    const GAME_SIZE = 400;

    let audioCtx;
    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playSound(type) {
        if (!audioCtx) return;
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'bounce') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, now);
            osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            osc.start(now);
            osc.stop(now + 0.1);
        } else if (type === 'break') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.exponentialRampToValueAtTime(40, now + 0.2);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
            
            // Add noise
            const bufferSize = audioCtx.sampleRate * 0.2;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;
            const noiseGain = audioCtx.createGain();
            noiseGain.gain.setValueAtTime(0.2, now);
            noiseGain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
            noise.connect(noiseGain);
            noiseGain.connect(audioCtx.destination);
            noise.start(now);
            
            osc.start(now);
            osc.stop(now + 0.2);
        } else if (type === 'fireball_start') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(200, now);
            osc.frequency.linearRampToValueAtTime(1200, now + 0.4);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
            osc.start(now);
            osc.stop(now + 0.4);
        } else if (type === 'fireball_hit') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(100, now);
            osc.frequency.exponentialRampToValueAtTime(20, now + 0.3);
            gain.gain.setValueAtTime(0.4, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
            osc.start(now);
            osc.stop(now + 0.3);
        }
    }

    let state = 'START'; // START, PLAYING, GAMEOVER, VICTORY
    let score = 0;
    let lives = 3;
    let lastTime = 0;

    const paddle = {
        w: 70, h: 12,
        x: GAME_SIZE / 2 - 35,
        y: GAME_SIZE - 30,
        speed: 300,
        color: '#00e676'
    };

    const ball = {
        radius: 6,
        x: 0, y: 0,
        vx: 0, vy: 0,
        baseSpeed: 250,
        active: false,
        isFireball: false,
        fireballTimeRemaining: 0
    };

    let bricks = [];
    let particles = [];

    // Special Ability Settings
    let specialReady = true;
    const SPECIAL_COOLDOWN = 8000; // 8 seconds
    const FIREBALL_DURATION = 3000; // 3 seconds of smashing

    function initLevel() {
        bricks = [];
        const rows = 6;
        const cols = 8;
        const padding = 4;
        const offsetTop = 40;
        const offsetLeft = 14;
        const w = (GAME_SIZE - (offsetLeft * 2) - (padding * (cols - 1))) / cols;
        const h = 18;

        const colors = ['#ff1744', '#ff9100', '#ffea00', '#00e676', '#00b0ff', '#d500f9'];

        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                bricks.push({
                    x: offsetLeft + c * (w + padding),
                    y: offsetTop + r * (h + padding),
                    w: w,
                    h: h,
                    color: colors[r % colors.length],
                    alive: true
                });
            }
        }
    }

    function resetBall() {
        ball.active = false;
        ball.isFireball = false;
        ball.fireballTimeRemaining = 0;
        paddle.x = GAME_SIZE / 2 - paddle.w / 2;
    }

    const input = { left: false, right: false };

    function bindButton(id, actionOn, actionOff) {
        const btn = document.getElementById(id);
        const press = (e) => { e.preventDefault(); initAudio(); btn.classList.add('active'); if(actionOn) actionOn(); };
        const release = (e) => { e.preventDefault(); btn.classList.remove('active'); if(actionOff) actionOff(); };
        
        btn.addEventListener('touchstart', press, {passive: false});
        btn.addEventListener('mousedown', press);
        btn.addEventListener('touchend', release, {passive: false});
        btn.addEventListener('mouseup', release);
        btn.addEventListener('mouseleave', release);
    }

    bindButton('btn-left', () => input.left = true, () => input.left = false);
    bindButton('btn-right', () => input.right = true, () => input.right = false);
    
    bindButton('btn-launch', () => {
        if (state === 'START' || state === 'GAMEOVER' || state === 'VICTORY') {
            startGame();
        } else if (!ball.active) {
            // Launch ball
            ball.active = true;
            // Launch at an angle
            let dir = (Math.random() > 0.5 ? 1 : -1);
            ball.vx = dir * ball.baseSpeed * 0.7;
            ball.vy = -ball.baseSpeed;
        }
    }, null);

    bindButton('btn-special', () => {
        if (state === 'PLAYING' && ball.active && specialReady && !ball.isFireball) {
            activateFireball();
        }
    }, null);

    function activateFireball() {
        specialReady = false;
        ball.isFireball = true;
        ball.fireballTimeRemaining = FIREBALL_DURATION;
        playSound('fireball_start');
        
        btnSpecial.classList.add('cooldown');
        specialCooldownDisplay.innerText = "FIREBALL: ACTIVE";
        specialCooldownDisplay.style.color = "#ffeb3b";

        // Start cooldown after duration ends
        setTimeout(() => {
            specialCooldownDisplay.innerText = "COOLDOWN...";
            specialCooldownDisplay.style.color = "#888";
            
            setTimeout(() => {
                specialReady = true;
                btnSpecial.classList.remove('cooldown');
                specialCooldownDisplay.innerText = "FIREBALL: READY";
                specialCooldownDisplay.style.color = "#ff3d00";
            }, SPECIAL_COOLDOWN);

        }, FIREBALL_DURATION);
    }

    function createExplosion(x, y, color, isMassive = false) {
        let count = isMassive ? 30 : 12;
        for (let i = 0; i < count; i++) {
            let angle = Math.random() * Math.PI * 2;
            let speed = Math.random() * (isMassive ? 150 : 80) + 20;
            particles.push({
                x: x, y: y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                life: 1.0,
                color: color,
                size: Math.random() * 4 + 2
            });
        }
    }

    function startGame() {
        score = 0;
        lives = 3;
        state = 'PLAYING';
        overlay.classList.add('hidden');
        specialReady = true;
        btnSpecial.classList.remove('cooldown');
        specialCooldownDisplay.innerText = "FIREBALL: READY";
        specialCooldownDisplay.style.color = "#ff3d00";
        initLevel();
        resetBall();
        updateHUD();
        if (!lastTime) requestAnimationFrame(gameLoop);
    }

    function updateHUD() {
        scoreDisplay.innerText = `SCORE: ${score}`;
        livesDisplay.innerText = `LIVES: ${lives}`;
    }

    function checkWin() {
        let allDead = true;
        for (let b of bricks) {
            if (b.alive) { allDead = false; break; }
        }
        if (allDead) {
            state = 'VICTORY';
            overlayTitle.innerText = "SECTOR CLEARED";
            overlayTitle.style.color = "#00e676";
            overlayText.innerHTML = `SCORE: ${score}<br>Tap LAUNCH to continue.`;
            overlay.classList.remove('hidden');
        }
    }

    function update(dt) {
        if (state !== 'PLAYING') return;

        // Paddle Move
        if (input.left) paddle.x -= paddle.speed * dt;
        if (input.right) paddle.x += paddle.speed * dt;
        
        if (paddle.x < 0) paddle.x = 0;
        if (paddle.x + paddle.w > GAME_SIZE) paddle.x = GAME_SIZE - paddle.w;

        // Ball Logic
        if (!ball.active) {
            ball.x = paddle.x + paddle.w / 2;
            ball.y = paddle.y - ball.radius - 1;
        } else {
            // Fireball timer
            if (ball.isFireball) {
                ball.fireballTimeRemaining -= dt * 1000;
                // Add trail particles
                if (Math.random() < 0.6) {
                    particles.push({
                        x: ball.x + (Math.random()-0.5)*10, y: ball.y + (Math.random()-0.5)*10,
                        vx: 0, vy: 0, life: 0.5, color: '#ff3d00', size: 3
                    });
                }
                if (ball.fireballTimeRemaining <= 0) {
                    ball.isFireball = false;
                }
            }

            // Move ball
            let nextX = ball.x + ball.vx * dt;
            let nextY = ball.y + ball.vy * dt;

            // Wall Collisions
            if (nextX - ball.radius < 0) { nextX = ball.radius; ball.vx *= -1; playSound('bounce'); }
            if (nextX + ball.radius > GAME_SIZE) { nextX = GAME_SIZE - ball.radius; ball.vx *= -1; playSound('bounce'); }
            if (nextY - ball.radius < 0) { nextY = ball.radius; ball.vy *= -1; playSound('bounce'); }
            
            // Bottom out
            if (nextY + ball.radius > GAME_SIZE) {
                lives--;
                updateHUD();
                if (lives <= 0) {
                    state = 'GAMEOVER';
                    overlayTitle.innerText = "GAME OVER";
                    overlayTitle.style.color = "#ff1744";
                    overlayText.innerHTML = `FINAL SCORE: ${score}<br>Tap LAUNCH to restart.`;
                    overlay.classList.remove('hidden');
                } else {
                    resetBall();
                }
                return; // Stop processing physics this frame
            }

            // Paddle Collision
            if (nextY + ball.radius > paddle.y && nextY - ball.radius < paddle.y + paddle.h &&
                nextX + ball.radius > paddle.x && nextX - ball.radius < paddle.x + paddle.w) {
                
                // Only bounce if falling down to prevent getting stuck
                if (ball.vy > 0) {
                    nextY = paddle.y - ball.radius;
                    ball.vy *= -1;
                    
                    // Angle based on hit location
                    let hitPoint = nextX - (paddle.x + paddle.w / 2);
                    let normalizedHit = hitPoint / (paddle.w / 2); // -1 to 1
                    
                    // Max angle change
                    ball.vx = normalizedHit * ball.baseSpeed * 1.2; 
                    
                    // Normalize speed so it doesn't slow down/speed up too much vertically
                    let currentSpeed = Math.hypot(ball.vx, ball.vy);
                    let targetSpeed = ball.baseSpeed + (ball.isFireball ? 100 : 0);
                    ball.vx = (ball.vx / currentSpeed) * targetSpeed;
                    ball.vy = (ball.vy / currentSpeed) * targetSpeed;
                    
                    // Ensure it always goes up
                    ball.vy = -Math.abs(ball.vy);
                    
                    playSound('bounce');
                }
            }

            // Brick Collisions
            let hitBrick = false;
            for (let b of bricks) {
                if (!b.alive) continue;

                // Simple Circle-AABB Check
                let testX = nextX;
                let testY = nextY;
                
                if (nextX < b.x) testX = b.x;
                else if (nextX > b.x + b.w) testX = b.x + b.w;
                
                if (nextY < b.y) testY = b.y;
                else if (nextY > b.y + b.h) testY = b.y + b.h;

                let distX = nextX - testX;
                let distY = nextY - testY;
                let distance = Math.hypot(distX, distY);

                if (distance <= ball.radius) {
                    // Collision!
                    b.alive = false;
                    score += 10;
                    updateHUD();
                    hitBrick = true;

                    if (ball.isFireball) {
                        playSound('fireball_hit');
                        createExplosion(b.x + b.w/2, b.y + b.h/2, '#ff3d00', true);
                        // Do NOT reverse velocity, smash straight through
                    } else {
                        playSound('break');
                        createExplosion(b.x + b.w/2, b.y + b.h/2, b.color, false);
                        
                        // Calculate bounce direction based on which side was hit
                        // A simple way is to check overlap depths
                        let overlapLeft = (nextX + ball.radius) - b.x;
                        let overlapRight = (b.x + b.w) - (nextX - ball.radius);
                        let overlapTop = (nextY + ball.radius) - b.y;
                        let overlapBottom = (b.y + b.h) - (nextY - ball.radius);

                        let minOverlap = Math.min(overlapLeft, overlapRight, overlapTop, overlapBottom);

                        if (minOverlap === overlapLeft || minOverlap === overlapRight) {
                            ball.vx *= -1;
                        } else {
                            ball.vy *= -1;
                        }
                    }
                    // Only process one brick collision per frame to prevent weird multi-bounce physics
                    break; 
                }
            }

            ball.x = nextX;
            ball.y = nextY;
            
            if (hitBrick) checkWin();
        }

        // Update Particles
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.life -= dt * 1.5;
            if (p.life <= 0) particles.splice(i, 1);
        }
    }

    function draw() {
        // Clear screen with a slight trail
        ctx.fillStyle = 'rgba(10, 10, 26, 0.4)';
        ctx.fillRect(0, 0, GAME_SIZE, GAME_SIZE);

        if (state === 'START') return;

        // Draw Bricks
        for (let b of bricks) {
            if (b.alive) {
                ctx.fillStyle = b.color;
                // Add simple gradient/bevel effect
                ctx.fillRect(b.x, b.y, b.w, b.h);
                ctx.fillStyle = 'rgba(255,255,255,0.3)';
                ctx.fillRect(b.x, b.y, b.w, 4); // Top highlight
                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.fillRect(b.x, b.y + b.h - 4, b.w, 4); // Bottom shadow
            }
        }

        // Draw Paddle
        ctx.fillStyle = paddle.color;
        ctx.shadowBlur = 10;
        ctx.shadowColor = paddle.color;
        // Rounded paddle
        ctx.beginPath();
        ctx.roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 6);
        ctx.fill();
        ctx.shadowBlur = 0;

        // Draw Ball
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
        if (ball.isFireball) {
            ctx.fillStyle = '#fff';
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#ff3d00';
            ctx.fill();
            // Inner core
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius - 2, 0, Math.PI * 2);
            ctx.fillStyle = '#ffea00';
            ctx.fill();
        } else {
            ctx.fillStyle = '#fff';
            ctx.shadowBlur = 8;
            ctx.shadowColor = '#00b0ff';
            ctx.fill();
        }
        ctx.shadowBlur = 0;

        // Draw Particles
        for (let p of particles) {
            ctx.globalAlpha = Math.max(0, p.life);
            ctx.fillStyle = p.color;
            ctx.fillRect(p.x, p.y, p.size, p.size);
        }
        ctx.globalAlpha = 1.0;
    }

    function gameLoop(timestamp) {
        if (!lastTime) lastTime = timestamp;
        let dt = (timestamp - lastTime) / 1000;
        if (dt > 0.1) dt = 0.1; // Cap delta time
        lastTime = timestamp;

        update(dt);
        draw();

        requestAnimationFrame(gameLoop);
    }
    
    // Initial draw to setup background
    ctx.fillStyle = '#0a0a1a';
    ctx.fillRect(0, 0, GAME_SIZE, GAME_SIZE);

</script>
</body>
</html>
