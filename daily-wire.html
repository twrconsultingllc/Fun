<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' https://ichef.bbci.co.uk https://media.npr.org https://i.guim.co.uk https://static01.nyt.com https://cdn.arstechnica.net https://platform.theverge.com https://media.wired.com https://techcrunch.com https://github.blog https://static.simonwillison.net https://www.nasa.gov https://www.quantamagazine.org https://www.sciencedaily.com https://media.springernature.com https://krebsonsecurity.com https://imgs.xkcd.com https://*.ytimg.com https://npr.brightspotcdn.com https://d3i6fh83elv35t.cloudfront.net https://assets.science.nasa.gov https://images-assets.nasa.gov; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
<meta name="description" content="My Daily Wire: a personal news reader. Southwest Florida local news plus headlines from BBC, NPR, Ars Technica, NASA, CISA, USGS, xkcd and more, refreshed every six hours as magazine cards under NASA's Image of the Day.">
<title>My Daily Wire</title>
<script>
    /* Apply a saved Theme choice before first paint, so there's no flash. */
    try { var t = localStorage.getItem('dailyWire.theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) { /* storage blocked */ }
</script>
<style>
    :root {
        --bg: #eceff3;
        --surface: #ffffff;
        --ink: #141922;
        --muted: #586173;
        --line: #d6dbe3;
        --accent: #c7361a;
        --accent-ink: #ffffff;
        --chip: #e1e5ec;
        --read: #697183;
        --focus: #1f5fd6;
        --shadow-sm: 0 1px 2px rgba(20, 25, 34, 0.06), 0 6px 18px -12px rgba(20, 25, 34, 0.25);
        --shadow: 0 2px 6px rgba(20, 25, 34, 0.08), 0 16px 36px -18px rgba(20, 25, 34, 0.4);
        --news: #b8321b;
        --tech: #1f5fd6;
        --dev: #6a3fc1;
        --science: #0f7a5c;
        --security: #9a5b00;
        --live: #b0246a;
        --fun: #c2410c;
        --business: #36597a;
        --swfl: #00708f;
        --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
        --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    }
    /* Dark palette: follows the device (Auto) unless the Theme button has
       pinned light or dark on <html data-theme>. */
    @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
            color-scheme: dark;
            --bg: #0e1116;
            --surface: #171b23;
            --ink: #e8ebf1;
            --muted: #a0a8b8;
            --line: #2a303c;
            --accent: #ff7b5c;
            --accent-ink: #1a0a05;
            --chip: #222834;
            --read: #858d9e;
            --focus: #8db4ff;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4), 0 6px 18px -12px rgba(0, 0, 0, 0.7);
            --shadow: 0 2px 6px rgba(0, 0, 0, 0.45), 0 16px 36px -18px rgba(0, 0, 0, 0.85);
            --news: #ff8a73;
            --tech: #8db4ff;
            --dev: #bfa2ff;
            --science: #5fd1ac;
            --security: #f2b24e;
            --live: #ff8cc0;
            --fun: #ff9c63;
            --business: #9cc0e2;
            --swfl: #5cc8e6;
        }
    }
    :root[data-theme="dark"] {
        color-scheme: dark;
        --bg: #0e1116;
        --surface: #171b23;
        --ink: #e8ebf1;
        --muted: #a0a8b8;
        --line: #2a303c;
        --accent: #ff7b5c;
        --accent-ink: #1a0a05;
        --chip: #222834;
        --read: #858d9e;
        --focus: #8db4ff;
        --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4), 0 6px 18px -12px rgba(0, 0, 0, 0.7);
        --shadow: 0 2px 6px rgba(0, 0, 0, 0.45), 0 16px 36px -18px rgba(0, 0, 0, 0.85);
        --news: #ff8a73;
        --tech: #8db4ff;
        --dev: #bfa2ff;
        --science: #5fd1ac;
        --security: #f2b24e;
        --live: #ff8cc0;
        --fun: #ff9c63;
        --business: #9cc0e2;
        --swfl: #5cc8e6;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
        background: var(--bg);
        color: var(--ink);
        font: 15px/1.45 var(--sans);
        padding-bottom: max(32px, env(safe-area-inset-bottom));
    }
    .wrap { max-width: 1212px; margin: 0 auto; padding-inline: 16px; display: grid; gap: 18px; }
    a { color: inherit; }
    :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

    /* hero: NASA Image of the Day, full-bleed behind the masthead. Its text
       is always white over a dark scrim, whatever the theme, and its bottom
       edge fades into the page background so the grid below blends in. */
    .hero {
        --gutter: max(16px, calc((100% - 1180px) / 2));
        position: relative; isolation: isolate; overflow: hidden; color: #fff;
        min-height: 440px; height: min(82vh, 760px);
        display: grid; grid-template-rows: auto 1fr auto;
        padding: max(16px, env(safe-area-inset-top)) var(--gutter) 128px;
        background:
            radial-gradient(1px 1px at 12% 22%, #fff9, transparent 60%),
            radial-gradient(1px 1px at 38% 64%, #fff8, transparent 60%),
            radial-gradient(1.5px 1.5px at 71% 18%, #fffb, transparent 60%),
            radial-gradient(1px 1px at 86% 52%, #fff7, transparent 60%),
            radial-gradient(1px 1px at 56% 36%, #fff6, transparent 60%),
            radial-gradient(1.5px 1.5px at 24% 78%, #fff8, transparent 60%),
            radial-gradient(ellipse 70% 60% at 75% 20%, #243a78 0%, transparent 70%),
            radial-gradient(ellipse 60% 55% at 15% 85%, #4a1f5c 0%, transparent 70%),
            #05070d;
    }
    .hero.compact { height: auto; min-height: 240px; }
    .hero-art { position: absolute; inset: 0; z-index: -2; }
    .hero-art img {
        width: 100%; height: 100%; object-fit: cover; display: block;
        opacity: 0; transform: scale(1.06); transition: opacity 0.9s ease;
    }
    .hero-art img.ready { opacity: 1; animation: drift 40s ease-out forwards; }
    @keyframes drift { from { transform: scale(1.06); } to { transform: scale(1); } }
    .hero::before, .hero::after { content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none; }
    .hero::before {
        /* Measured in px from each edge, not %, so the scrim stays behind
           the masthead and caption at every hero height. */
        background:
            linear-gradient(to bottom, rgba(3, 5, 10, 0.72) 0, rgba(3, 5, 10, 0.6) 130px, rgba(3, 5, 10, 0) 240px),
            linear-gradient(to top, rgba(3, 5, 10, 0.82) 0, rgba(3, 5, 10, 0.72) 400px, rgba(3, 5, 10, 0) 540px);
    }
    .hero::after { top: auto; height: 120px; background: linear-gradient(to bottom, transparent, var(--bg)); }
    .hero a { color: #fff; }
    .hero :focus-visible { outline-color: #fff; }

    .masthead { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 8px 24px; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6); }
    .masthead h1 { font: 700 clamp(34px, 7vw, 58px)/1 var(--serif); letter-spacing: -0.01em; margin: 2px 0 0; }
    .masthead h1 span { color: #ffc4b0; }
    .dateline { display: grid; gap: 2px; justify-items: end; text-align: right; }
    .dateline .today { font: 600 14px var(--sans); }
    .stamp { font: 500 12px var(--mono); color: #fff; }
    .home { font-size: 13px; color: rgba(255, 255, 255, 0.86); text-decoration: none; }
    .home:hover { text-decoration: underline; }

    .hero-caption { grid-row: 3; max-width: 720px; display: grid; gap: 6px; text-shadow: 0 1px 4px rgba(0, 0, 0, 0.7); }
    .kicker { font: 700 11px var(--sans); letter-spacing: 0.12em; text-transform: uppercase; color: rgba(255, 255, 255, 0.9); }
    .hero-title { margin: 0; font: 700 clamp(24px, 3.6vw, 38px)/1.12 var(--serif); text-wrap: balance; overflow-wrap: anywhere; }
    .hero-title a { text-decoration: none; }
    .hero-title a:hover { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 4px; }
    .hero-summary {
        margin: 0; max-width: 62ch; font-size: 15px; color: rgba(255, 255, 255, 0.9); overflow-wrap: anywhere;
        display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .hero-nav { display: flex; align-items: center; gap: 10px; margin-top: 6px; font: 500 12px var(--mono); }
    .hero-nav button {
        width: 38px; height: 38px; border-radius: 50%; cursor: pointer; color: #fff; font: 600 20px/1 var(--sans);
        background: rgba(255, 255, 255, 0.14); border: 1px solid rgba(255, 255, 255, 0.35);
        -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    }
    .hero-nav button:hover { background: rgba(255, 255, 255, 0.26); }

    /* controls: a frosted bar that overlaps the hero's fade, then sticks */
    .controls {
        position: sticky; top: max(8px, env(safe-area-inset-top)); z-index: 5;
        margin-top: -92px; padding: 12px; display: grid; gap: 10px;
        background: color-mix(in srgb, var(--surface) 90%, transparent);
        -webkit-backdrop-filter: blur(16px) saturate(1.4); backdrop-filter: blur(16px) saturate(1.4);
        border: 1px solid color-mix(in srgb, var(--line) 80%, transparent); border-radius: 16px;
        box-shadow: var(--shadow);
    }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
        font: 500 13px var(--sans); border: 1px solid transparent; background: var(--chip); color: var(--ink);
        padding: 5px 11px; border-radius: 999px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center;
    }
    .chip .n { font: 500 11px var(--mono); color: var(--muted); }
    .chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
    .chip[aria-pressed="true"] .n { color: var(--bg); opacity: 0.75; }
    .tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .search {
        flex: 1 1 220px; min-width: 0; font: 14px var(--sans); color: var(--ink); background: var(--surface);
        border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px;
    }
    .tool {
        font: 500 13px var(--sans); color: var(--ink); background: var(--surface); border: 1px solid var(--line);
        border-radius: 10px; padding: 8px 12px; cursor: pointer;
    }
    .tool[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }

    /* cards */
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px; }
    .card {
        position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
        overflow: hidden; display: grid; grid-template-rows: auto 1fr; box-shadow: var(--shadow-sm);
        transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
    }
    .card:hover { border-color: var(--muted); transform: translateY(-2px); box-shadow: var(--shadow); }
    .card:has(h2 a:focus-visible) { outline: 2px solid var(--focus); outline-offset: 2px; }
    .media { aspect-ratio: 16 / 9; max-width: 100%; background: var(--chip); overflow: hidden; }
    .media img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.4s ease; }
    .card:hover .media img { transform: scale(1.04); }
    .panel {
        width: 100%; height: 100%; display: grid; align-content: end; padding: 14px 16px; gap: 2px;
        background: color-mix(in srgb, var(--cat) 14%, var(--surface));
        border-bottom: 3px solid var(--cat);
    }
    .panel .big { font: 700 clamp(26px, 3.2vw, 34px)/1.05 var(--serif); color: var(--cat); }
    .panel .small { font: 500 12px var(--mono); color: var(--muted); }
    .body { padding: 12px 14px 14px; display: grid; gap: 6px; align-content: start; }
    .cat { font: 700 11px var(--sans); letter-spacing: 0.08em; text-transform: uppercase; color: var(--cat); }
    .card h2 { font: 600 18px/1.25 var(--serif); margin: 0; text-wrap: balance; overflow-wrap: anywhere; }
    .card h2 a { text-decoration: none; }
    .card h2 a::after { content: ""; position: absolute; inset: 0; }
    .card h2 a:focus-visible { outline: none; }
    .card:hover h2 a { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
    .summary {
        margin: 0; color: var(--muted); font-size: 14px; overflow-wrap: anywhere;
        display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
    }
    .meta { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; font: 500 12px var(--mono); color: var(--muted); }
    .pill { font: 600 10.5px var(--sans); letter-spacing: 0.04em; text-transform: uppercase; border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; }
    .card.read h2, .card.read .summary { color: var(--read); }
    .card.read .media { opacity: 0.6; }

    .c-news { --cat: var(--news); } .c-tech { --cat: var(--tech); } .c-dev { --cat: var(--dev); }
    .c-science { --cat: var(--science); } .c-security { --cat: var(--security); } .c-live { --cat: var(--live); }
    .c-fun { --cat: var(--fun); } .c-business { --cat: var(--business); } .c-swfl { --cat: var(--swfl); }

    .more-row { display: flex; justify-content: center; }
    .more { font: 600 14px var(--sans); background: var(--ink); color: var(--bg); border: 0; border-radius: 8px; padding: 10px 18px; cursor: pointer; }
    .notice { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 20px; display: grid; gap: 6px; }
    .notice h2 { font: 600 20px var(--serif); margin: 0; }
    .notice p { margin: 0; color: var(--muted); max-width: 65ch; }

    footer { display: grid; gap: 10px; font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 14px; }
    footer p { margin: 0; max-width: 75ch; }
    details summary { cursor: pointer; color: var(--ink); font-weight: 500; }
    .feed-list { list-style: none; margin: 10px 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 4px 16px; font: 12px var(--mono); }
    .feed-list .bad { color: var(--accent); }
    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

    @media (max-width: 520px) {
        .dateline { justify-items: start; text-align: left; }
        .card h2 { font-size: 17px; }
        .hero { min-height: 480px; height: 78vh; }
        .controls { margin-top: -80px; padding: 10px; gap: 8px; }
        /* one swipeable row of chips, so the sticky bar stays short */
        .chips { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin-inline: -10px; padding-inline: 10px; }
        .chips::-webkit-scrollbar { display: none; }
        .chip { flex: none; }
        .search { flex-basis: 100%; }
        .tool { flex: 1 1 auto; padding: 7px 8px; font-size: 12.5px; }
    }
    @media (prefers-reduced-motion: reduce) {
        * { scroll-behavior: auto !important; }
        .hero-art img, .hero-art img.ready { animation: none; transform: none; transition: none; }
        .card, .card:hover, .media img, .card:hover .media img { transition: none; transform: none; }
    }
</style>
</head>
<body>
<header class="hero" id="hero">
    <div class="hero-art" id="heroArt"></div>
    <div class="masthead">
        <div>
            <a class="home" href="index.html">← Fun</a>
            <h1>My Daily <span>Wire</span></h1>
        </div>
        <div class="dateline">
            <span class="today" id="today"></span>
            <span class="stamp" id="stamp">Loading headlines…</span>
        </div>
    </div>
    <div class="hero-caption" id="heroCaption" hidden></div>
</header>

<div class="wrap">
    <div class="controls">
        <div class="chips" id="chips" role="group" aria-label="Categories"></div>
        <div class="tools">
            <label class="sr" for="search">Search headlines</label>
            <input class="search" id="search" type="search" placeholder="Search headlines  ( / )" autocomplete="off">
            <button class="tool" id="unread" type="button" aria-pressed="false">Unread only</button>
            <button class="tool" id="markAll" type="button">Mark shown as read</button>
            <button class="tool" id="theme" type="button" title="Switch between following your device, light and dark">Theme: Auto</button>
        </div>
    </div>

    <main>
        <p class="sr" id="live" aria-live="polite"></p>
        <div class="cards" id="cards"></div>
        <div class="notice" id="notice" hidden>
            <h2 id="noticeTitle"></h2>
            <p id="noticeText"></p>
        </div>
    </main>
    <div class="more-row"><button class="more" id="more" type="button" hidden>Show more</button></div>

    <footer>
        <p>Headlines, summaries and images belong to their publishers. Every card links to the original story. Pictures load from the publisher's own site with no referrer.</p>
        <details id="status">
            <summary id="statusSummary">Feed status</summary>
            <ul class="feed-list" id="feedList"></ul>
        </details>
    </footer>
</div>

<script>
(() => {
    'use strict';

    const DATA_URL = 'daily-wire/feeds.json';
    const PAGE_SIZE = 30;
    const READ_KEY = 'dailyWire.read.v1';
    const READ_MAX = 3000;

    /* Must match feeds.config.json "imageHosts" and the CSP img-src above.
       tests/daily-wire.dom.test.mjs checks all three stay in sync. */
    const IMAGE_HOSTS = [
        'ichef.bbci.co.uk', 'media.npr.org', 'i.guim.co.uk', 'static01.nyt.com',
        'cdn.arstechnica.net', 'platform.theverge.com', 'media.wired.com', 'techcrunch.com',
        'github.blog', 'static.simonwillison.net', 'www.nasa.gov', 'www.quantamagazine.org',
        'www.sciencedaily.com', 'media.springernature.com', 'krebsonsecurity.com',
        'imgs.xkcd.com', '*.ytimg.com',
        // added after the first real run reported them in imageHostsDropped
        'npr.brightspotcdn.com', 'd3i6fh83elv35t.cloudfront.net',
        'assets.science.nasa.gov', 'images-assets.nasa.gov'
    ];

    const DEFAULT_CATEGORIES = [
        { id: 'swfl', label: 'SW FL' }, { id: 'news', label: 'News' }, { id: 'tech', label: 'Tech' }, { id: 'dev', label: 'Dev & AI' },
        { id: 'science', label: 'Science & space' }, { id: 'security', label: 'Security' },
        { id: 'live', label: 'Live data' }, { id: 'fun', label: 'Fun' }, { id: 'business', label: 'Business' }
    ];

    const $ = (id) => document.getElementById(id);
    const state = {
        data: null, items: [], feeds: [], categories: DEFAULT_CATEGORIES,
        cat: 'all', q: '', unreadOnly: false, limit: PAGE_SIZE, read: loadRead(), loading: true,
        paywalled: new Set(), hero: [], heroAt: 0
    };

    /* The hero shows NASA's Image of the Day, newest first; the arrows step
       back through the last few. Only items whose image passed safeImage()
       qualify, so the hero obeys the same host allowlist as the cards. */
    const HERO_FEED = 'nasa-iotd';
    const HERO_MAX = 8;

    /* ---------- validation: the page trusts nothing in feeds.json ---------- */

    function hostAllowed(host) {
        host = host.toLowerCase();
        return IMAGE_HOSTS.some((e) => e.startsWith('*.')
            ? host.endsWith(e.slice(1)) && host.length > e.length - 1
            : host === e);
    }

    function safeLink(s) {
        if (typeof s !== 'string' || s.length > 2048) return null;
        try {
            const u = new URL(s);
            if ((u.protocol === 'https:' || u.protocol === 'http:') && !u.username && !u.password) return u.href;
        } catch (e) { /* not a URL */ }
        return null;
    }

    function safeImage(s) {
        if (typeof s !== 'string' || s.length > 2048) return null;
        try {
            const u = new URL(s);
            if (u.protocol === 'https:' && !u.username && !u.password && hostAllowed(u.hostname)) return u.href;
        } catch (e) { /* not a URL */ }
        return null;
    }

    const str = (v, max) => (typeof v === 'string' ? v.slice(0, max) : '');

    function ingest(data) {
        state.loading = false;
        const ok = data && typeof data === 'object' && Array.isArray(data.items);
        state.data = ok ? data : null;
        const cats = ok && Array.isArray(data.categories) && data.categories.length
            ? data.categories.filter((c) => c && /^[a-z]{2,20}$/.test(c.id) && typeof c.label === 'string')
                .map((c) => ({ id: c.id, label: c.label.slice(0, 40) }))
            : DEFAULT_CATEGORIES;
        state.categories = cats.length ? cats : DEFAULT_CATEGORIES;
        const known = new Set(state.categories.map((c) => c.id));
        state.feeds = ok && Array.isArray(data.feeds) ? data.feeds.filter((f) => f && typeof f.id === 'string').slice(0, 200) : [];
        state.items = [];
        const ids = new Set();
        for (const it of ok ? data.items.slice(0, 2000) : []) {
            if (!it || typeof it !== 'object') continue;
            const link = safeLink(it.link);
            const title = str(it.title, 300).trim();
            if (!link || !title || !known.has(it.category)) continue;
            const id = /^[a-f0-9]{12}$/.test(it.id) ? it.id : null;
            if (!id || ids.has(id)) continue;
            ids.add(id);
            const t = typeof it.date === 'string' ? Date.parse(it.date) : NaN;
            state.items.push({
                id, link, title,
                category: it.category,
                feed: str(it.feed, 60),
                source: str(it.source, 80) || 'Unknown source',
                summary: str(it.summary, 400),
                image: safeImage(it.image),
                time: Number.isFinite(t) ? t : null,
                lower: (title + ' ' + str(it.summary, 400) + ' ' + str(it.source, 80)).toLowerCase()
            });
        }
        state.items.sort((a, b) => (b.time || 0) - (a.time || 0));
        state.limit = PAGE_SIZE;
        state.hero = state.items.filter((it) => it.feed === HERO_FEED && it.image).slice(0, HERO_MAX);
        state.heroAt = 0;
        renderHero();
        render();
    }

    /* ---------- read tracking (this browser only) ---------- */

    function loadRead() {
        try {
            const raw = JSON.parse(localStorage.getItem(READ_KEY) || '[]');
            if (Array.isArray(raw)) return new Set(raw.filter((x) => typeof x === 'string' && /^[a-f0-9]{12}$/.test(x)).slice(-READ_MAX));
        } catch (e) { /* storage blocked or corrupt */ }
        return new Set();
    }

    function saveRead() {
        try { localStorage.setItem(READ_KEY, JSON.stringify([...state.read].slice(-READ_MAX))); } catch (e) { /* ignore */ }
    }

    function markRead(ids) {
        for (const id of ids) { state.read.delete(id); state.read.add(id); }
        saveRead();
    }

    /* ---------- formatting ---------- */

    function ago(t, now = Date.now()) {
        if (!t) return '';
        const m = Math.max(0, Math.floor((now - t) / 60000));
        if (m < 1) return 'just now';
        if (m < 60) return m + ' min ago';
        const h = Math.round(m / 60);
        if (h < 24) return h + ' h ago';
        const d = Math.round(h / 24);
        if (d < 7) return d + ' d ago';
        return new Date(t).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    }

    /* Cards with no picture get a panel. Earthquakes show their magnitude,
       everything else the source name, so the grid never has blank holes. */
    function panelText(item) {
        const quake = item.title.match(/^M\s?(\d+(?:\.\d+)?)\b/);
        if (quake) return { big: 'M ' + quake[1], small: 'magnitude' };
        if (item.feed === 'nws-fl' || item.feed === 'nws-swfl') return { big: item.title.split(/ issued | for /i)[0].slice(0, 40), small: item.source };
        return { big: item.source, small: '' };
    }

    const labelFor = (id) => (state.categories.find((c) => c.id === id) || { label: id }).label;

    function el(tag, cls, text) {
        const n = document.createElement(tag);
        if (cls) n.className = cls;
        if (text != null) n.textContent = text;
        return n;
    }

    function buildPanel(item) {
        const p = el('div', 'panel');
        const t = panelText(item);
        p.append(el('span', 'big', t.big));
        if (t.small) p.append(el('span', 'small', t.small));
        return p;
    }

    function card(item) {
        const a = el('article', 'card c-' + item.category + (state.read.has(item.id) ? ' read' : ''));
        a.dataset.id = item.id;
        const media = el('div', 'media');
        if (item.image) {
            const img = document.createElement('img');
            img.alt = '';
            img.setAttribute('loading', 'lazy');
            img.setAttribute('decoding', 'async');
            img.referrerPolicy = 'no-referrer';
            img.addEventListener('error', () => { media.replaceChildren(buildPanel(item)); }, { once: true });
            img.src = item.image;
            media.append(img);
        } else {
            media.append(buildPanel(item));
        }
        const body = el('div', 'body');
        const h = el('h2');
        const link = el('a', null, item.title);
        link.href = item.link;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        link.referrerPolicy = 'no-referrer';
        h.append(link);
        body.append(el('span', 'cat', labelFor(item.category)), h);
        if (item.summary) body.append(el('p', 'summary', item.summary));
        const meta = el('div', 'meta');
        meta.append(el('span', null, item.source));
        if (item.time) {
            const time = el('time', null, ago(item.time));
            time.dateTime = new Date(item.time).toISOString();
            time.title = new Date(item.time).toLocaleString();
            meta.append(el('span', null, '·'), time);
        }
        if (state.paywalled.has(item.feed)) meta.append(el('span', 'pill', 'Paywall'));
        body.append(meta);
        a.append(media, body);
        return a;
    }

    /* ---------- rendering ---------- */

    function filtered() {
        const words = state.q.toLowerCase().split(/\s+/).filter(Boolean);
        return state.items.filter((it) =>
            (state.cat === 'all' || it.category === state.cat) &&
            (!state.unreadOnly || !state.read.has(it.id)) &&
            words.every((w) => it.lower.includes(w)));
    }

    function renderChips() {
        const counts = {};
        for (const it of state.items) counts[it.category] = (counts[it.category] || 0) + 1;
        const chips = [{ id: 'all', label: 'All', n: state.items.length },
            ...state.categories.map((c) => ({ ...c, n: counts[c.id] || 0 }))];
        $('chips').replaceChildren(...chips.map((c) => {
            const b = el('button', 'chip');
            b.type = 'button';
            b.dataset.cat = c.id;
            b.setAttribute('aria-pressed', String(state.cat === c.id));
            b.append(el('span', null, c.label), el('span', 'n', String(c.n)));
            return b;
        }));
    }

    function renderStamp() {
        const g = state.data && Date.parse(state.data.generatedAt);
        const hours = state.data && Number.isInteger(state.data.refreshHours) ? state.data.refreshHours : 6;
        $('stamp').textContent = Number.isFinite(g)
            ? 'Updated ' + new Date(g).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) + ' · checks every ' + hours + ' h'
            : 'Waiting for the first update';
    }

    function renderStatus() {
        const feeds = state.feeds;
        const bad = feeds.filter((f) => !f.ok);
        $('statusSummary').textContent = feeds.length
            ? `Feed status: ${feeds.length - bad.length} of ${feeds.length} updated on the last run`
            : 'Feed status: no runs yet';
        $('feedList').replaceChildren(...feeds.map((f) => {
            const li = el('li', f.ok ? null : 'bad');
            li.textContent = (f.ok ? '✓ ' : '✗ ') + str(f.source, 80) + (f.ok ? ` (${Number(f.count) || 0})` : ' — ' + str(f.error, 120));
            return li;
        }));
    }

    function showNotice(title, text) {
        $('noticeTitle').textContent = title;
        $('noticeText').textContent = text;
        $('notice').hidden = false;
    }

    function render() {
        state.paywalled = new Set(state.feeds.filter((f) => f.paywall === true).map((f) => f.id));
        renderChips();
        renderStamp();
        renderStatus();
        const list = filtered();
        const shown = list.slice(0, state.limit);
        $('cards').replaceChildren(...shown.map(card));
        $('more').hidden = list.length <= state.limit;
        $('more').textContent = `Show more (${list.length - shown.length} left)`;
        $('notice').hidden = true;
        if (state.loading) {
            $('stamp').textContent = 'Loading headlines…';
        } else if (!state.items.length) {
            showNotice(state.data ? 'No headlines yet' : 'Headlines could not be loaded',
                state.data
                    ? 'The feed list updates on a schedule every few hours. Once the first update has run, headlines appear here.'
                    : 'The headline file did not load. Check your connection and reload the page.');
        } else if (!list.length) {
            showNotice('Nothing matches', state.unreadOnly ? 'You have read everything here. Turn off "Unread only" to see it again.' : 'Try a different search or category.');
        }
        $('unread').setAttribute('aria-pressed', String(state.unreadOnly));
        $('live').textContent = `${list.length} headlines shown`;
    }

    /* ---------- hero ---------- */

    function renderHero() {
        const hero = $('hero'), art = $('heroArt'), cap = $('heroCaption');
        const item = state.hero[state.heroAt];
        hero.classList.toggle('compact', !state.loading && !item);
        if (!item) { art.replaceChildren(); cap.replaceChildren(); cap.hidden = true; return; }

        const img = document.createElement('img');
        img.alt = item.title;
        img.setAttribute('decoding', 'async');
        img.setAttribute('fetchpriority', 'high');
        img.referrerPolicy = 'no-referrer';
        img.addEventListener('load', () => img.classList.add('ready'), { once: true });
        img.addEventListener('error', () => {
            // Drop the broken picture and show the next one, if any.
            if (state.hero[state.heroAt] !== item) return;
            state.hero.splice(state.heroAt, 1);
            if (state.heroAt >= state.hero.length) state.heroAt = 0;
            renderHero();
        }, { once: true });
        img.src = item.image;
        art.replaceChildren(img);

        const kicker = el('span', 'kicker', item.source);
        if (item.time) {
            const time = el('time', null, new Date(item.time).toLocaleDateString('en-US', { month: 'long', day: 'numeric' }));
            time.dateTime = new Date(item.time).toISOString();
            kicker.append(' · ', time);
        }
        const title = el('p', 'hero-title');
        const link = el('a', null, item.title);
        link.href = item.link;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        link.referrerPolicy = 'no-referrer';
        title.append(link);
        cap.replaceChildren(kicker, title);
        if (item.summary) cap.append(el('p', 'hero-summary', item.summary));
        if (state.hero.length > 1) {
            const nav = el('div', 'hero-nav');
            const prev = el('button', null, '‹');
            prev.type = 'button';
            prev.dataset.step = '-1';
            prev.setAttribute('aria-label', 'Previous image');
            const next = el('button', null, '›');
            next.type = 'button';
            next.dataset.step = '1';
            next.setAttribute('aria-label', 'Next image');
            const count = el('span', 'hero-count', `${state.heroAt + 1} / ${state.hero.length}`);
            nav.append(prev, count, next);
            cap.append(nav);
        }
        cap.hidden = false;
    }

    function stepHero(by) {
        const n = state.hero.length;
        if (n < 2) return;
        state.heroAt = (state.heroAt + by + n) % n;
        renderHero();
        const again = $('heroCaption').querySelector(`[data-step="${by > 0 ? 1 : -1}"]`);
        if (again) again.focus();
    }

    $('heroCaption').addEventListener('click', (e) => {
        const b = e.target.closest('button[data-step]');
        if (b) stepHero(Number(b.dataset.step));
    });

    /* ---------- events ---------- */

    $('chips').addEventListener('click', (e) => {
        const b = e.target.closest('.chip');
        if (!b) return;
        state.cat = b.dataset.cat;
        state.limit = PAGE_SIZE;
        render();
    });

    let searchTimer = 0;
    $('search').addEventListener('input', (e) => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => { state.q = e.target.value.slice(0, 100); state.limit = PAGE_SIZE; render(); }, 120);
    });

    $('unread').addEventListener('click', () => { state.unreadOnly = !state.unreadOnly; state.limit = PAGE_SIZE; render(); });

    $('markAll').addEventListener('click', () => {
        markRead(filtered().slice(0, state.limit).map((it) => it.id));
        render();
    });

    $('more').addEventListener('click', () => { state.limit += PAGE_SIZE; render(); });

    /* Opening a story (click, middle-click, Enter) marks it read. */
    function onOpen(e) {
        const link = e.target.closest('.card h2 a');
        if (!link) return;
        const c = link.closest('.card');
        markRead([c.dataset.id]);
        c.classList.add('read');
    }
    $('cards').addEventListener('click', onOpen);
    $('cards').addEventListener('auxclick', onOpen);

    document.addEventListener('keydown', (e) => {
        if (e.key === '/' && document.activeElement !== $('search') && !e.ctrlKey && !e.metaKey) {
            e.preventDefault();
            $('search').focus();
        }
    });

    $('today').textContent = new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });

    async function load() {
        if (typeof fetch !== 'function') { ingest(null); return; }
        try {
            const res = await fetch(DATA_URL, { cache: 'no-cache' });
            if (!res.ok) throw new Error('HTTP ' + res.status);
            ingest(await res.json());
        } catch (e) {
            ingest(null);
        }
    }

    /* Theme button: Auto (follow the device) → Light → Dark → Auto. The choice
       is kept in this browser only; the <head> script applies it on load. */
    const THEME_KEY = 'dailyWire.theme';
    const THEMES = ['auto', 'light', 'dark'];
    function currentTheme() {
        const t = document.documentElement.dataset.theme;
        return t === 'light' || t === 'dark' ? t : 'auto';
    }
    function setTheme(t) {
        if (!THEMES.includes(t)) t = 'auto';
        if (t === 'auto') delete document.documentElement.dataset.theme;
        else document.documentElement.dataset.theme = t;
        try {
            if (t === 'auto') localStorage.removeItem(THEME_KEY);
            else localStorage.setItem(THEME_KEY, t);
        } catch (e) { /* storage blocked: the choice lasts until reload */ }
        $('theme').textContent = 'Theme: ' + t[0].toUpperCase() + t.slice(1);
    }
    $('theme').addEventListener('click', () => setTheme(THEMES[(THEMES.indexOf(currentTheme()) + 1) % THEMES.length]));
    setTheme(currentTheme());

    // Test hook (tests/daily-wire.dom.test.mjs). Nothing on the page reads it.
    window.__dailywire = { ingest, state, render, renderHero, stepHero, markRead, ago, setTheme, currentTheme, IMAGE_HOSTS, DATA_URL };

    renderHero();
    render();
    load();
})();
</script>
</body>
</html>
