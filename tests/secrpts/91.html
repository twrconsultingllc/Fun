<div class="wrap">
  <header>
    <h1>Review #91 — Vercel skip rule: never a failed deployment</h1>
    <p class="sub">Every merge to <code>main</code> since 2026-10-12 (PR #134 onward, seven merges) showed "Deployment has failed" for the <code>fun</code> and <code>funv2</code> Vercel projects, and Vercel emailed each time. The live apps were never affected: they kept serving their last good build. The cause was the build-skip rule added in <a href="76.html">review 76</a>.</p>
    <div class="meta">Review performed 2026-10-23 · scope: <code>battle-bots/vercel.json</code>, <code>battle-bots-V2/vercel.json</code>, <code>jarvis/cloud/vercel.json</code> (<code>ignoreCommand</code>), <code>tests/vercel-builds.test.mjs</code> · suites run: <code>vercel-builds</code> in full (a small fix, per CLAUDE.md).</div>
    <div class="legend">
      <span><span class="dot fixed"></span> Fixed / confirmed clean</span>
      <span><span class="dot open"></span> Open</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" style="width: 100%;"></div></div>
    <div class="progress-label">2 items: 1 fixed, 1 verified clean.</div>
  </header>
  <section>
    <h2><span class="num">01</span>Code quality</h2>
    <div class="item">
      <div class="item-head"><div class="item-title">The rule exited 128 once the last deploy left Vercel's shallow clone</div><span class="badge fixed">Fixed</span></div>
      <div class="item-body"><p>The rule compared <code>HEAD</code> with <code>VERCEL_GIT_PREVIOUS_SHA</code>, the commit each project last actually deployed. Skipped builds don't move that commit forward. For <code>fun</code> it stayed at the merge of PR #124 (<code>2da5de1</code>). Vercel's commit statuses show the skip still working 20 commits later (<code>2e976d2</code>) and failing 22 commits later (<code>441943f</code>), from then on at every merge. At that point the commit was no longer in Vercel's shallow clone, and <code>git diff</code> exited 128. The old test assumed any non-zero code meant "build". Vercel treats only 1 that way and reports anything else as a failed deployment. So a real Battle Bots change would also have failed to deploy. Vercel's own logs couldn't be read from this container; the diagnosis rests on the status timeline and on reproducing the exit code.</p>
      <p>The new command is <code>p="$VERCEL_GIT_PREVIOUS_SHA"; git cat-file -e "$p^{commit}" 2&gt;/dev/null || p=HEAD^; git diff --quiet "$p" HEAD -- . || exit 1</code>. If the last deploy is missing, or there isn't one, it compares with the commit before. Any other git error ends in <code>exit 1</code> (build), so it only ever answers 0 or 1. The cost: a change made in an earlier commit that never deployed, and that has since left the clone, could be skipped. A manual Redeploy in Vercel covers that.</p>
      <div class="fix-note"><b>Checks:</b> <code>vercel-builds</code> now clones its scratch repo two commits deep and asks about an older deploy, the real failure. Fixed: 20 passed. Broken copy (the old command): 7 failed. In a 5-deep clone of this repo with <code>VERCEL_GIT_PREVIOUS_SHA=2da5de1</code>, the old command exited 128 and the new one 0.</div></div>
    </div>
  </section>
  <section>
    <h2><span class="num">02</span>Security</h2>
    <div class="item">
      <div class="item-head"><div class="item-title">Same inputs, no new surface</div><span class="badge fixed">Confirmed clean</span></div>
      <div class="item-body"><p>The command still reads only Vercel's own <code>VERCEL_GIT_PREVIOUS_SHA</code>, always quoted, and runs git read-only (<code>cat-file -e</code>, <code>diff --quiet</code>) inside Vercel's build container. Each <code>vercel.json</code> keeps its security headers (the suite checks it). Merging this changes all three folders, so each project builds once, which also moves each project's last deploy up to date.</p></div>
    </div>
  </section>
