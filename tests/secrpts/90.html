<div class="wrap">
  <header>
    <h1>Review #90 — Tests workflow (CI)</h1>
    <p class="sub">A new workflow, <code>.github/workflows/ci.yml</code> ("Tests"), runs <code>npm test</code> in <code>tests/</code> on every push to <code>main</code>, on every pull request, and by hand. Until now the suites only ran inside a session. This repo is public, so the runs use no Actions minutes from the account's allowance.</p>
    <div class="meta">Review performed 2026-10-22 · scope: <code>.github/workflows/ci.yml</code> (new) · suites run: all, locally (<code>npm test</code>), since this adds the job that runs them all.</div>
    <div class="legend">
      <span><span class="dot fixed"></span> Fixed / confirmed clean</span>
      <span><span class="dot open"></span> Open</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" style="width: 67%;"></div></div>
    <div class="progress-label">3 items: 2 verified clean, 1 open.</div>
  </header>
  <section>
    <h2><span class="num">01</span>Security</h2>
    <div class="item">
      <div class="item-head"><div class="item-title">Read-only token, pinned actions, no secrets</div><span class="badge fixed">Confirmed clean</span></div>
      <div class="item-body"><p>The workflow sets <code>permissions: contents: read</code>, and checkout uses <code>persist-credentials: false</code>, so no token is left in git config while the tests run. <code>actions/checkout</code> and <code>actions/setup-node</code> are pinned to the same full commit SHAs as the four existing workflows. Both installs use <code>npm ci --ignore-scripts</code> against committed lockfiles. It reads no secrets. The <code>pull_request</code> trigger (not <code>pull_request_target</code>) runs a fork's code without the repo's secrets or a write token. <code>npm audit</code> found 0 vulnerabilities in <code>tests/</code>, <code>daily-wire/</code>, <code>battle-bots/</code> and <code>battle-bots-V2/</code>.</p></div>
    </div>
  </section>
  <section>
    <h2><span class="num">02</span>Code quality</h2>
    <div class="item">
      <div class="item-head"><div class="item-title">It runs the same suites a session runs</div><span class="badge fixed">Confirmed clean</span></div>
      <div class="item-body"><p>A local run of <code>npm test</code> passed 6,025 checks and failed 1: <code>wire-core</code>'s "fetcher module loads", because <code>daily-wire/</code>'s own dependency wasn't installed. The workflow now installs it the same way <code>daily-wire.yml</code> does, and <code>wire-core</code> then passed all 107 checks. The run took 16 min 39 s on the clock but only 1 min 22 s of CPU time (most of it is the suites' own timer waits), so the job's 45-minute timeout leaves room. A newer push to the same branch cancels a run still in progress. The YAML parses (checked with Python's <code>yaml.safe_load</code>).</p>
      <div class="fix-note"><b>Broken copy:</b> the first version, without the Daily Wire install, failed the local run (the 1 failure above). That's the failure the added step fixes.</div></div>
    </div>
    <div class="item">
      <div class="item-head"><div class="item-title">It reports; it can't stop a deploy</div><span class="badge open">Open</span></div>
      <div class="item-body"><p>GitHub Pages publishes <code>main</code> on its own, whether or not this run passes. So a red run means the last push should be checked, not that the site was protected. The Chromium checks (<code>tests/*.chromium.mjs</code>) aren't in the workflow, because they need Playwright, a browser and ffmpeg. They stay a by-hand check in a claude.ai/code session. Left open on purpose: blocking the deploy would mean switching Pages to an Actions-based deploy, a bigger change nobody has asked for.</p></div>
    </div>
  </section>
