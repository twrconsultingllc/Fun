<div class="wrap">
  <header>
    <h1>Review #92 — Dependency security: claude-architect-lab</h1>
    <p class="sub">Dependabot alert #3 flagged <code>hono</code> in <code>claude-architect-lab/</code>, the exam-prep lab. It's a study project that runs only when started by hand, and nothing here deploys it. Dependabot's PR #141 updated <code>hono</code>. <code>npm audit</code> then still found four advisories in the same folder, fixed here with <code>npm audit fix</code>.</p>
    <div class="meta">Review performed 2026-10-24 · scope: <code>claude-architect-lab/package-lock.json</code> · checks run: the lab's own <code>npm test</code> (82 tests, no network) and <code>npm audit</code> in every folder with a <code>package.json</code>. No page changed, so no page suite applies; the Tests workflow runs on the PR.</div>
    <div class="legend">
      <span><span class="dot fixed"></span> Fixed / confirmed clean</span>
      <span><span class="dot open"></span> Open</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" style="width: 100%;"></div></div>
    <div class="progress-label">2 items: 1 fixed, 1 verified clean.</div>
  </header>
  <section>
    <h2><span class="num">01</span>Security</h2>
    <div class="item">
      <div class="item-head"><div class="item-title">Six vulnerable packages in the lab, all updated</div><span class="badge fixed">Fixed</span></div>
      <div class="item-body"><p>All six come in through the lab's dependencies (mostly the MCP SDK's optional HTTP transport). The lab's code uses none of them directly.</p>
      <ul>
        <li><code>hono</code> 4.13.8 → 4.13.13 (PR #141, Dependabot): <code>serveStatic</code> decoded paths twice, letting a crafted request skip middleware (GHSA-5r4p-p66f-jhc7).</li>
        <li><code>zod</code> 4.6.5 → 4.6.7 (high): memory exhaustion on oversized constrained collections (GHSA-mrhx-c7xc-m3w5).</li>
        <li><code>body-parser</code> 2.3.0 → 2.4.0 (high), with <code>qs</code> 6.16.0 → 6.16.1: denial of service via trailing bytes after a compressed body (GHSA-27r3-jxmh-p828).</li>
        <li><code>fast-uri</code> 3.1.8 → 3.1.9 (moderate): four URI parsing and normalisation advisories.</li>
        <li><code>ip-address</code> 10.7.2 → 10.7.4 (moderate): quadratic time on a long zone identifier (GHSA-rxp7-6hxx-x8q5).</li>
      </ul>
      <p>Only the lockfile changed; <code>package.json</code>'s ranges already allowed every fixed version. Every new <code>resolved</code> URL is on <code>registry.npmjs.org</code>.</p>
      <div class="fix-note"><b>Checks:</b> before: <code>npm audit</code> reported 4 vulnerabilities (2 high, 2 moderate) after #141. After: 0. The lab's <code>npm test</code>: 82 passed, 0 failed, on both #141 and this change.</div></div>
    </div>
    <div class="item">
      <div class="item-head"><div class="item-title">Every other package folder in the repo</div><span class="badge fixed">Confirmed clean</span></div>
      <div class="item-body"><p><code>npm audit</code> found 0 vulnerabilities in <code>battle-bots/</code>, <code>battle-bots-V2/</code>, <code>daily-wire/</code> and <code>tests/</code>. <code>jarvis/cloud/</code> has no dependencies at all.</p></div>
    </div>
  </section>
